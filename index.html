<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UMIT | Компактный плеер</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: background-color 0.3s ease, color 0.2s;
    }

    /* Базовые переменные (фиолетовая тема по умолчанию) */
    body.theme-amethyst {
      --bg-body: #0a0a0f;
      --bg-player: rgba(18, 18, 26, 0.95);
      --text-primary: #efeff1;
      --text-secondary: #aaa;
      --accent: #b03cff;
      --accent-grad-start: #b03cff;
      --accent-grad-end: #9b2ce8;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(176, 60, 255, 0.3);
      --btn-bg: rgba(255, 255, 255, 0.05);
      --slider-bg: #2c2c34;
      --scrollbar: #b03cff;
      --glow: rgba(176, 60, 255, 0.5);
    }
    body.theme-moonlight {
      --bg-body: #e8eef2;
      --bg-player: rgba(245, 248, 250, 0.95);
      --text-primary: #1a1a2c;
      --text-secondary: #4a5568;
      --accent: #2c7da0;
      --accent-grad-start: #2c7da0;
      --accent-grad-end: #1f5e7e;
      --border-light: rgba(0, 0, 0, 0.08);
      --border-focus: rgba(44, 125, 160, 0.3);
      --btn-bg: rgba(0, 0, 0, 0.05);
      --slider-bg: #cbd5e0;
      --scrollbar: #2c7da0;
      --glow: rgba(44, 125, 160, 0.5);
    }
    body.theme-nightshade {
      --bg-body: #03030a;
      --bg-player: rgba(5, 5, 12, 0.96);
      --text-primary: #e2e2e8;
      --text-secondary: #8889a0;
      --accent: #ff6b6b;
      --accent-grad-start: #ff6b6b;
      --accent-grad-end: #e04e4e;
      --border-light: rgba(255, 255, 255, 0.05);
      --border-focus: rgba(255, 107, 107, 0.3);
      --btn-bg: rgba(255, 255, 255, 0.03);
      --slider-bg: #222230;
      --scrollbar: #ff6b6b;
      --glow: rgba(255, 107, 107, 0.5);
    }
    body.theme-cloud {
      --bg-body: #d9dde3;
      --bg-player: rgba(230, 235, 240, 0.95);
      --text-primary: #2d3748;
      --text-secondary: #5a6a7a;
      --accent: #718096;
      --accent-grad-start: #718096;
      --accent-grad-end: #4a5568;
      --border-light: rgba(0, 0, 0, 0.06);
      --border-focus: rgba(113, 128, 150, 0.3);
      --btn-bg: rgba(0, 0, 0, 0.04);
      --slider-bg: #bdc1c9;
      --scrollbar: #718096;
      --glow: rgba(113, 128, 150, 0.5);
    }
    body.theme-forest {
      --bg-body: #1a2f1f;
      --bg-player: rgba(25, 45, 30, 0.95);
      --text-primary: #e6f2e8;
      --text-secondary: #b0c4b0;
      --accent: #6fbf4c;
      --accent-grad-start: #6fbf4c;
      --accent-grad-end: #4e9c2c;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(111, 191, 76, 0.3);
      --btn-bg: rgba(255, 255, 255, 0.05);
      --slider-bg: #2e4a2e;
      --scrollbar: #6fbf4c;
      --glow: rgba(111, 191, 76, 0.5);
    }

    body {
      background: var(--bg-body);
      color: var(--text-primary);
    }

    .player {
      max-width: 560px;
      width: 100%;
      background: var(--bg-player);
      backdrop-filter: blur(24px);
      border-radius: 44px;
      padding: 28px 26px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-light);
      transition: all 0.2s;
    }

    /* верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 12px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--accent-grad-start), var(--accent-grad-end));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    .lang-theme-buttons {
      display: flex;
      gap: 8px;
    }
    #langBtn, #themeBtn {
      background: var(--btn-bg);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    #langBtn:hover, #themeBtn:hover { background: var(--border-focus); color: var(--accent); }
    .chevron, .theme-chevron { font-size: 0.65rem; transition: transform 0.2s; }
    #langBtn.open .chevron, #themeBtn.open .theme-chevron { transform: rotate(180deg); }

    /* дропдауны */
    .dropdown {
      position: fixed;
      z-index: 9999;
      background: var(--bg-player);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-focus);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      transform: scale(0.92) translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    .dropdown.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    .dropdown-option {
      padding: 8px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      color: var(--text-primary);
    }
    .dropdown-option:hover { background: var(--border-focus); }
    .dropdown-option.active { background: var(--accent); color: white; }

    /* обложка + инфо */
    .media-row {
      display: flex;
      gap: 22px;
      margin-bottom: 28px;
      align-items: center;
    }
    .cover {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      flex-shrink: 0;
      background: #2a2a30;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .track-author {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .time-lbl {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 40px;
    }
    .time-lbl.r { text-align: right; }
    input[type="range"] {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      background: var(--slider-bg);
      border-radius: 5px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px var(--glow);
    }
    #progress-bar {
      background: linear-gradient(to right, var(--accent) var(--pct, 0%), var(--slider-bg) var(--pct, 0%));
    }
    #volume-slider {
      background: linear-gradient(to right, var(--accent) var(--vpct, 100%), var(--slider-bg) var(--vpct, 100%));
    }

    .main-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }
    .main-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .main-btn:active { transform: scale(0.94); }
    .main-btn.play {
      background: var(--accent);
      color: white;
      font-size: 1.8rem;
      width: 72px;
      height: 72px;
      box-shadow: 0 6px 18px var(--glow);
    }
    .extra-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      margin-bottom: 28px;
    }
    .extra-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 1.1rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }
    .extra-btn:active { transform: scale(0.92); }
    .extra-btn.active { color: var(--accent); border-color: var(--accent); background: var(--border-focus); }
    .repeat-badge {
      position: absolute;
      bottom: -2px;
      right: -4px;
      background: var(--accent);
      color: var(--bg-body);
      font-size: 0.65rem;
      font-weight: bold;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .vol-ic { color: var(--text-secondary); font-size: 0.85rem; width: 24px; }

    .playlist-tabs {
      display: flex;
      gap: 28px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 12px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      transition: 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      margin-bottom: -13px;
    }
    #playlistContainer {
      max-height: 300px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .author-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 16px 0 8px;
    }
    .pl-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 8px;
      border-radius: 16px;
      cursor: pointer;
      transition: 0.1s;
    }
    .pl-item:hover { background: var(--border-focus); }
    .pl-item.playing { background: var(--border-focus); }
    .pl-item.playing .pl-title { color: var(--accent); font-weight: 600; }
    .pl-thumb {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--slider-bg);
    }
    .pl-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pl-meta { flex: 1; min-width: 0; }
    .pl-title {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .pl-dur {
      font-size: 0.7rem;
      color: var(--text-secondary);
      min-width: 40px;
      text-align: right;
    }
    .lyr-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }
    .lyr-btn:hover { color: var(--accent); background: var(--border-focus); }
    .empty-fav {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    .modal-bg.show { opacity: 1; pointer-events: all; }
    .modal-card {
      background: var(--bg-player);
      border-radius: 32px 32px 0 0;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      transform: translateY(100%);
      transition: 0.3s;
    }
    .modal-bg.show .modal-card { transform: translateY(0); }
    .modal-hdr {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.2rem;
      cursor: pointer;
    }
    #lyrics-text {
      color: var(--text-secondary);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.8rem;
      opacity: 0;
      transition: 0.2s;
      z-index: 10001;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; }
  </style>
</head>
<body class="theme-amethyst">

<div id="langDd" class="dropdown"></div>
<div id="themeDd" class="dropdown"></div>
<div class="player">
  <div class="top-bar">
    <div class="logo">UMIT Player</div>
    <div class="lang-theme-buttons">
      <button id="langBtn"><span id="langLabel">Русский</span> <i class="fas fa-chevron-down chevron"></i></button>
      <button id="themeBtn"><span id="themeLabel">Ametist</span> <i class="fas fa-palette theme-chevron"></i></button>
    </div>
  </div>

  <div class="media-row">
    <div class="cover"><img id="coverImg" src="" alt="cover"></div>
    <div class="track-info">
      <div class="track-title" id="trackTitle">Выберите трек</div>
      <div class="track-author" id="trackAuthor">UMIT</div>
    </div>
  </div>

  <div class="progress-row">
    <span class="time-lbl" id="curTime">0:00</span>
    <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.01">
    <span class="time-lbl r" id="durTime">0:00</span>
  </div>

  <div class="main-controls">
    <button class="main-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
    <button class="main-btn play" id="playBtn"><i class="fas fa-play" id="playIcon"></i></button>
    <button class="main-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
  </div>

  <div class="extra-controls">
    <button class="extra-btn" id="shuffleBtn"><i class="fas fa-shuffle"></i></button>
    <button class="extra-btn" id="repeatBtn"><i class="fas fa-repeat"></i><span id="repeatBadge" class="repeat-badge" style="display: none;">1</span></button>
    <button class="extra-btn" id="favBtn"><i class="far fa-heart"></i></button>
  </div>

  <div class="volume-row">
    <i class="fas fa-volume-off vol-ic"></i>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
    <i class="fas fa-volume-high vol-ic"></i>
  </div>

  <div class="playlist-tabs">
    <button class="tab-btn active" data-tab="all" data-key="songsList">📋 Все песни</button>
    <button class="tab-btn" data-tab="fav" data-key="favTab">❤️ Избранное</button>
  </div>
  <div id="playlistContainer"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-hdr">
      <span class="modal-title" data-key="lyricsTitle">Текст песни</span>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="lyrics-text"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

    { tk:"s6", src:"Wedding_fog.mp3", cover:"Wedding_fog.jpg", author:"a1", lyrics:"Wedding Fog..." },
    { tk:"s7", src:"Wedding_fog2.mp3", cover:"Wedding_fog2.jpg", author:"a1", lyrics:"Wedding Fog 2..." },
    { tk:"s8", src:"Along_the_roads.mp3", cover:"Along_the_roads.jpg", author:"a1", lyrics:"Along the roads..." },
    { tk:"s9", src:"Anashym.mp3", cover:"Anashym.jpg", author:"a1", lyrics:"Анашым, анашым..." },
    { tk:"s10", src:"Koktem_audio.mp3", cover:"Koktem.jpg", author:"a2", lyrics:"Көктем әні..." },
    { tk:"s11", src:"Tuğan_tūyıs_baqytym.mp3", cover:"Tūğan_tūyıs_baqytym.jpg", author:"a2", lyrics:"Туған туыс бақытым..." }
  ];

  let lang = localStorage.getItem('umit_lang') || 'ru';
  let currentTheme = localStorage.getItem('umit_theme') || 'amethyst';
  let curIdx = -1, shuffle = false, repeatState = 0, currentTab = 'all';
  let favs = JSON.parse(localStorage.getItem('umit_favs') || '[]');
  let durations = {};
  const audio = new Audio();
  const T = () => I18N[lang];
  const fmt = s => isNaN(s) ? '0:00' : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  function showToast(msg) { let t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

  // Применение темы
  function applyTheme() {
    const theme = THEMES[currentTheme];
    document.body.className = theme.className;
    document.getElementById('themeLabel').innerText = theme.name;
    // обновить градиент прогресса и громкости (они зависят от переменных CSS, но перерисовка через событие)
    if (prog) prog.style.setProperty('--pct', (prog.value || 0) + '%');
    if (volSlider) updateVolGrad();
  }

  // Сохранение состояния (добавляем тему)
  function saveState() {
    if(curIdx<0) return;
    localStorage.setItem('umit_player_state', JSON.stringify({
      curIdx, currentTime: audio.currentTime||0, isPlaying: !audio.paused,
      volume: audio.volume, shuffle, repeat: repeatState, lang, favs, theme: currentTheme
    }));
  }
  function restoreState() {
    let s = localStorage.getItem('umit_player_state');
    if(!s) return;
    try {
      let d = JSON.parse(s);
      if(d.lang && I18N[d.lang]) lang = d.lang;
      if(d.favs) favs = d.favs;
      if(d.theme && THEMES[d.theme]) currentTheme = d.theme;
      else currentTheme = 'amethyst';
      shuffle = d.shuffle || false;
      repeatState = d.repeat || 0;
      if(d.volume !== undefined) { audio.volume = d.volume; document.getElementById('volume-slider').value = d.volume; updateVolGrad(); }
      if(d.curIdx>=0 && d.curIdx<TRACKS.length) {
        curIdx = d.curIdx;
        let tr = TRACKS[curIdx];
        audio.src = tr.src;
        document.getElementById('coverImg').src = tr.cover;
        document.getElementById('trackTitle').innerText = T()[tr.tk];
        document.getElementById('trackAuthor').innerText = T()[tr.author];
        audio.load();
        audio.addEventListener('loadedmetadata', ()=>{
          if(d.currentTime && d.currentTime<audio.duration) audio.currentTime = d.currentTime;
          if(d.isPlaying) audio.play().catch(e=>console.log);
          else setPlaying(false);
          updateFavBtn();
          renderPlaylist();
          updateMediaSession();
        }, {once:true});
      }
      updateShuffleUI();
      updateRepeatUI();
      applyTheme();
      applyLang();
    } catch(e) {}
  }

  const playIcon = document.getElementById('playIcon');
  const coverImg = document.getElementById('coverImg');
  const prog = document.getElementById('progress-bar');
  const volSlider = document.getElementById('volume-slider');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  function setPlaying(on) {
    playIcon.className = on ? 'fas fa-pause' : 'fas fa-play';
    if(navigator.mediaSession) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
    saveState();
  }
  function loadTrack(idx) {
    if(idx===curIdx && !audio.paused) { togglePlay(); return; }
    curIdx = idx;
    let tr = TRACKS[idx];
    audio.src = tr.src;
    coverImg.src = tr.cover;
    document.getElementById('trackTitle').innerText = T()[tr.tk];
    document.getElementById('trackAuthor').innerText = T()[tr.author];
    prog.value = 0; prog.style.setProperty('--pct','0%');
    curTimeEl.innerText = '0:00';
    durTimeEl.innerText = durations[idx] ? fmt(durations[idx]) : '0:00';
    audio.load();
    audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false));
    renderPlaylist();
    updateFavBtn();
    updateMediaSession();
    saveState();
  }
  function togglePlay() { if(curIdx<0) loadTrack(0); else audio.paused ? audio.play() : audio.pause(); }
  function nextTrack() {
    if(repeatState===1) { audio.currentTime=0; audio.play(); return; }
    let next = shuffle ? (()=>{ let x; do x=Math.floor(Math.random()*TRACKS.length); while(x===curIdx && TRACKS.length>1); return x; })() : (curIdx+1)%TRACKS.length;
    if(next===0 && curIdx===TRACKS.length-1 && repeatState!==2) { setPlaying(false); audio.currentTime=0; return; }
    loadTrack(next);
  }
  function prevTrack() {
    if(curIdx<0) loadTrack(TRACKS.length-1);
    else if(audio.currentTime>3) audio.currentTime=0;
    else loadTrack((curIdx-1+TRACKS.length)%TRACKS.length);
  }
  function updateRepeatUI() {
    let btn=document.getElementById('repeatBtn'), badge=document.getElementById('repeatBadge');
    btn.classList.remove('active'); badge.style.display='none';
    if(repeatState===1) { btn.classList.add('active'); badge.style.display='flex'; badge.innerText='1'; }
    else if(repeatState===2) btn.classList.add('active');
  }
  function cycleRepeat() { repeatState=(repeatState+1)%3; updateRepeatUI(); saveState(); showToast(['Повтор выкл','Повтор трека','Повтор плейлиста'][repeatState]); }
  function updateShuffleUI() { document.getElementById('shuffleBtn').classList.toggle('active', shuffle); }
  function toggleFav() {
    let i=favs.indexOf(curIdx);
    if(i<0) { favs.push(curIdx); showToast(T().added); }
    else { favs.splice(i,1); showToast(T().removed); }
    localStorage.setItem('umit_favs',JSON.stringify(favs));
    updateFavBtn(); renderPlaylist(); saveState();
  }
  function updateFavBtn() { document.getElementById('favBtn').querySelector('i').className = favs.includes(curIdx) ? 'fas fa-heart' : 'far fa-heart'; }
  function updateVolGrad() { volSlider.style.setProperty('--vpct', (volSlider.value*100).toFixed(1)+'%'); }
  function updateMediaSession() {
    if(!navigator.mediaSession) return;
    let tr=TRACKS[curIdx];
    navigator.mediaSession.metadata = new MediaMetadata({ title: T()[tr.tk], artist: T()[tr.author], artwork: [{ src: tr.cover }] });
  }

  function renderPlaylist() {
    let container = document.getElementById('playlistContainer');
    container.innerHTML = '';
    let list = currentTab==='all' ? TRACKS.map((_,i)=>i) : favs.filter(i=>i>=0&&i<TRACKS.length);
    if(list.length===0 && currentTab==='fav') { let d=document.createElement('div'); d.className='empty-fav'; d.innerText=T().emptyFav; container.appendChild(d); return; }
    let lastA=null;
    for(let idx of list) {
      let tr=TRACKS[idx];
      if(tr.author !== lastA) {
        let lbl=document.createElement('div'); lbl.className='author-label'; lbl.innerText=T()[tr.author];
        container.appendChild(lbl); lastA=tr.author;
      }
      let item=document.createElement('div');
      item.className='pl-item'+(idx===curIdx?' playing':'');
      item.innerHTML = `
        <div class="pl-thumb"><img src="${tr.cover}" loading="lazy"></div>
        <div class="pl-meta"><div class="pl-title">${T()[tr.tk]}</div></div>
        <span class="pl-dur">${durations[idx]?fmt(durations[idx]):'—:——'}</span>
        <button class="lyr-btn" data-i="${idx}"><i class="fas fa-file-lines"></i></button>
      `;
      item.addEventListener('click', e=>{ if(!e.target.closest('.lyr-btn')) loadTrack(idx); });
      item.querySelector('.lyr-btn').addEventListener('click', e=>{ e.stopPropagation(); openModal(idx); });
      container.appendChild(item);
    }
  }
  function openModal(i) {
    document.getElementById('lyrics-text').innerText = TRACKS[i].lyrics||'—';
    document.getElementById('modalBg').classList.add('show');
  }
  function closeModal() { document.getElementById('modalBg').classList.remove('show'); }

  function applyLang() {
    document.getElementById('langLabel').innerText = LANG_NAMES[lang];
    document.querySelectorAll('.lang-opt').forEach(o=>o.classList.toggle('active',o.dataset.lang===lang));
    document.querySelectorAll('[data-key]').forEach(el => { let k=el.dataset.key; if(T()[k]) el.innerText = T()[k]; });
    if(curIdx>=0) {
      document.getElementById('trackTitle').innerText = T()[TRACKS[curIdx].tk];
      document.getElementById('trackAuthor').innerText = T()[TRACKS[curIdx].author];
      updateMediaSession();
    }
    renderPlaylist();
  }

  audio.addEventListener('timeupdate',()=>{ if(audio.duration){ let p=audio.currentTime/audio.duration*100; prog.value=p; prog.style.setProperty('--pct',p+'%'); curTimeEl.innerText=fmt(audio.currentTime); } });
  audio.addEventListener('loadedmetadata',()=>{ durTimeEl.innerText=fmt(audio.duration); if(curIdx>=0&&audio.duration) durations[curIdx]=audio.duration; renderPlaylist(); });
  audio.addEventListener('ended',nextTrack);
  audio.addEventListener('play',()=>setPlaying(true));
  audio.addEventListener('pause',()=>setPlaying(false));
  prog.addEventListener('input',()=>{ if(audio.duration) audio.currentTime = prog.value/100*audio.duration; });
  volSlider.addEventListener('input',()=>{ audio.volume=volSlider.value; updateVolGrad(); saveState(); });

  document.getElementById('shuffleBtn').onclick=()=>{ shuffle=!shuffle; updateShuffleUI(); saveState(); showToast(shuffle?'Перемешивание вкл':'Перемешивание выкл'); };
  document.getElementById('repeatBtn').onclick=cycleRepeat;
  document.getElementById('prevBtn').onclick=prevTrack;
  document.getElementById('nextBtn').onclick=nextTrack;
  document.getElementById('playBtn').onclick=togglePlay;
  document.getElementById('favBtn').onclick=toggleFav;
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{ currentTab=btn.dataset.tab; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderPlaylist(); });

  // ---------- Выпадающие меню (язык и тема) ----------
  const langBtn = document.getElementById('langBtn'), langDd = document.getElementById('langDd');
  const themeBtn = document.getElementById('themeBtn'), themeDd = document.getElementById('themeDd');
  
  function buildLangMenu() {
    langDd.innerHTML = '';
    Object.keys(LANG_NAMES).forEach(code=>{
      let opt = document.createElement('div'); opt.className='dropdown-option'+(lang===code?' active':''); opt.dataset.lang=code;
      opt.innerHTML = (code==='kk'?'🇰🇿':code==='ru'?'🇷🇺':code==='en'?'🇺🇸':code==='fr'?'🇫🇷':'🇨🇳')+' '+LANG_NAMES[code];
      opt.onclick = (e)=>{ e.stopPropagation(); lang=code; localStorage.setItem('umit_lang',lang); applyLang(); closeDd(langDd, langBtn); saveState(); };
      langDd.appendChild(opt);
    });
  }
  function buildThemeMenu() {
    themeDd.innerHTML = '';
    Object.keys(THEMES).forEach(key=>{
      let opt = document.createElement('div'); opt.className='dropdown-option'+(currentTheme===key?' active':''); opt.dataset.theme=key;
      opt.innerHTML = THEMES[key].name;
      opt.onclick = (e)=>{ e.stopPropagation(); currentTheme=key; localStorage.setItem('umit_theme',currentTheme); applyTheme(); closeDd(themeDd, themeBtn); saveState(); };
      themeDd.appendChild(opt);
    });
  }
  function posDd(dd, btn){
    let r=btn.getBoundingClientRect();
    dd.style.top=r.bottom+8+'px';
    dd.style.right=window.innerWidth-r.right+'px';
    dd.style.left='auto';
  }
  function openDd(dd, btn){ posDd(dd, btn); dd.classList.add('open'); btn.classList.add('open'); }
  function closeDd(dd, btn){ dd.classList.remove('open'); btn.classList.remove('open'); }
  langBtn.onclick = (e)=>{ e.stopPropagation(); if(langDd.classList.contains('open')) closeDd(langDd, langBtn); else openDd(langDd, langBtn); };
  themeBtn.onclick = (e)=>{ e.stopPropagation(); if(themeDd.classList.contains('open')) closeDd(themeDd, themeBtn); else openDd(themeDd, themeBtn); };
  document.addEventListener('click', e=>{ if(!langDd.contains(e.target) && e.target!==langBtn) closeDd(langDd, langBtn); if(!themeDd.contains(e.target) && e.target!==themeBtn) closeDd(themeDd, themeBtn); });
  window.addEventListener('resize',()=>{ if(langDd.classList.contains('open')) posDd(langDd, langBtn); if(themeDd.classList.contains('open')) posDd(themeDd, themeBtn); });

  buildLangMenu();
  buildThemeMenu();
  applyTheme();
  applyLang();
  updateVolGrad();
  if(navigator.mediaSession) {
    navigator.mediaSession.setActionHandler('play',togglePlay);
    navigator.mediaSession.setActionHandler('pause',togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack',prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack',nextTrack);
  }
  restoreState();
  if(curIdx===-1 && TRACKS.length) loadTrack(0);
  setInterval(()=>{ if(curIdx!==-1 && !audio.paused) saveState(); }, 5000);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.code==='Space'){ e.preventDefault(); togglePlay(); } });
</script>
</body>
</html>
