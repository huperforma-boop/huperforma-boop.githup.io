<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMIT | Мобильный Плеер Glass</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ===== ПЕРЕМЕННЫЕ И СБРОС СТИЛЕЙ ===== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary-color: #ffffff;
            --accent-color: #5D8EF0;
            --accent-gradient: linear-gradient(135deg, #5D8EF0 0%, #8B6DFF 100%);
            --background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            --text-color: rgba(255, 255, 255, 0.95);
            --secondary-text: rgba(255, 255, 255, 0.7);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-strong: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--background);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(93, 142, 240, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 109, 255, 0.05) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            animation: slideUpFade 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== GLASSMORPHISM 2.0 ===== */
        .glass-card {
            background: var(--glass-bg);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            box-shadow: var(--shadow-soft);
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-strong);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 15px;
            animation: fadeIn 0.8s ease 0.2s forwards;
            opacity: 0;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color) 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        /* ===== ЯЗЫКОВОЙ ПЕРЕКЛЮЧАТЕЛЬ ===== */
        .language-switcher {
            position: relative;
        }

        .language-switcher button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            backdrop-filter: blur(10px);
        }

        .language-switcher button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .language-switcher button i {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .language-switcher button.active i {
            transform: rotate(180deg);
        }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 180px;
            padding: 12px 0;
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            backdrop-filter: blur(25px);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .lang-dropdown.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        .lang-option {
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 25px;
        }

        .lang-option.active {
            color: var(--accent-color);
            background: linear-gradient(90deg, rgba(93, 142, 240, 0.1), transparent);
        }

        .lang-option.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent-color);
            border-radius: 0 2px 2px 0;
        }

        /* ===== ПЛЕЕР ===== */
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.8s ease 0.3s forwards;
            opacity: 0;
        }

        /* ОБЛОЖКА С АНИМАЦИЕЙ */
        .cover-art {
            width: 100%;
            max-width: 280px;
            height: 280px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-10px) rotateX(5deg); }
        }

        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .cover-art.playing img {
            animation: rotateSlow 20s linear infinite;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cover-art::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.03));
            pointer-events: none;
        }

        /* ИНФОРМАЦИЯ О ТРЕКЕ */
        .track-info {
            text-align: center;
            width: 100%;
            animation: fadeInUp 0.6s ease 0.4s forwards;
            opacity: 0;
        }
        
        #current-track-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        
        #current-track-author {
            font-size: 1.1rem;
            color: var(--secondary-text);
            font-weight: 500;
            opacity: 0.9;
        }

        /* ПРОГРЕСС-БАР */
        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 12px;
            margin-top: 5px;
            animation: fadeInUp 0.6s ease 0.5s forwards;
            opacity: 0;
        }

        .time-display {
            font-size: 0.85rem;
            color: var(--secondary-text);
            min-width: 40px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }
        
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 20px rgba(93, 142, 240, 0.8);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        #progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(93, 142, 240, 1);
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        /* КНОПКИ УПРАВЛЕНИЯ */
        .main-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
            margin-top: 5px;
            gap: 20px;
            animation: fadeInUp 0.6s ease 0.6s forwards;
            opacity: 0;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px) scale(1.05);
        }

        .control-btn:active {
            transform: translateY(0) scale(0.98);
            transition-duration: 0.1s;
        }

        .control-btn:hover::before {
            opacity: 1;
        }

        .control-btn.play-pause {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            font-size: 1.8rem;
            box-shadow: 0 10px 30px rgba(93, 142, 240, 0.4);
        }

        .control-btn.play-pause:hover {
            box-shadow: 0 15px 40px rgba(93, 142, 240, 0.6);
            transform: translateY(-3px) scale(1.05);
        }

        .control-btn.play-pause:active {
            box-shadow: 0 5px 20px rgba(93, 142, 240, 0.3);
        }

        /* ГРОМКОСТЬ */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 0;
            animation: fadeInUp 0.6s ease 0.7s forwards;
            opacity: 0;
        }

        .volume-container i {
            font-size: 1.2rem;
            color: var(--secondary-text);
            transition: color 0.3s ease;
        }

        .volume-slider-container {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        #volume-slider {
            width: 100%;
            height: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }
        
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }
        
        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 100%;
            transform: scaleX(1);
            transform-origin: left;
            transition: transform 0.1s linear;
            pointer-events: none;
        }

        /* ИЗБРАННОЕ */
        #main-favorite-btn {
            animation: fadeInUp 0.6s ease 0.8s forwards;
            opacity: 0;
        }

        #main-favorite-btn i {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #main-favorite-btn.favorited i {
            color: #ff4757;
            transform: scale(1.2);
            animation: heartBeat 0.6s ease;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.2); }
        }

        /* СПИСОК ПЕСЕН */
        .playlist-header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.6s ease 0.9s forwards;
            opacity: 0;
        }

        .playlist-header i {
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        .playlist-author-header {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 24px;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeInLeft 0.5s ease forwards;
        }

        .playlist-author-header i {
            font-size: 0.9rem;
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInRight 0.5s ease forwards;
            opacity: 0;
            transform: translateX(10px);
            position: relative;
            overflow: hidden;
        }

        .playlist-item:nth-child(2) { animation-delay: 0.1s; }
        .playlist-item:nth-child(3) { animation-delay: 0.15s; }
        .playlist-item:nth-child(4) { animation-delay: 0.2s; }
        .playlist-item:nth-child(5) { animation-delay: 0.25s; }
        .playlist-item:nth-child(6) { animation-delay: 0.3s; }
        .playlist-item:nth-child(7) { animation-delay: 0.35s; }
        .playlist-item:nth-child(8) { animation-delay: 0.4s; }
        .playlist-item:nth-child(9) { animation-delay: 0.45s; }
        .playlist-item:nth-child(10) { animation-delay: 0.5s; }

        @keyframes fadeInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .playlist-item:active {
            transform: translateX(5px) scale(0.98);
            transition-duration: 0.1s;
        }

        .playlist-item.playing {
            background: linear-gradient(90deg, rgba(93, 142, 240, 0.15), rgba(139, 109, 255, 0.1));
            border-left: 3px solid var(--accent-color);
        }

        .playlist-item.playing .item-title {
            color: var(--primary-color);
            font-weight: 600;
        }

        .playlist-item.playing .item-index {
            color: var(--accent-color);
        }

        .item-index {
            width: 28px;
            font-size: 0.95rem;
            color: var(--secondary-text);
            text-align: center;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }
        
        .item-details {
            flex-grow: 1;
            padding: 0 16px;
            min-width: 0;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .item-duration {
            font-size: 0.85rem;
            color: var(--secondary-text);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            min-width: 45px;
        }

        /* КНОПКА ТЕКСТА ПЕСНИ В СПИСКЕ */
        .playlist-item .lyrics-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--secondary-text);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
        }

        .playlist-item .lyrics-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
            transform: translateY(-1px);
        }

        /* МОДАЛЬНОЕ ОКНО ТЕКСТА */
        .lyrics-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lyrics-modal.show {
            display: flex;
            opacity: 1;
        }

        .lyrics-content-card {
            width: 100%;
            max-width: 500px;
            height: 85%;
            background: rgba(30, 30, 32, 0.95);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 30px 25px;
            overflow-y: auto;
            position: relative;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
        }

        .lyrics-modal.show .lyrics-content-card {
            transform: translateY(0);
        }

        .lyrics-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lyrics-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        #lyrics-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-right: 50px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #lyrics-text {
            line-height: 1.8;
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.9);
            white-space: pre-wrap;
            font-weight: 400;
            padding: 10px 0;
        }

        /* АНИМАЦИИ */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* УВЕДОМЛЕНИЯ */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-gradient);
            color: white;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            z-index: 1001;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification i {
            font-size: 1.2rem;
        }

        /* ЗАГРУЗКА */
        .loading-wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-wave.show {
            display: flex;
            opacity: 1;
        }

        .wave {
            width: 5px;
            height: 30px;
            background: var(--accent-gradient);
            margin: 0 3px;
            border-radius: 10px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave:nth-child(2) { animation-delay: 0.1s; }
        .wave:nth-child(3) { animation-delay: 0.2s; }
        .wave:nth-child(4) { animation-delay: 0.3s; }
        .wave:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 60%, 100% { transform: scaleY(0.5); }
            30% { transform: scaleY(1); }
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 480px) {
            .mobile-container {
                max-width: 100%;
                margin-top: 0;
                padding: 10px;

            .glass-card {
                padding: 20px;

    ];

    // ===================================================
    // ЭЛЕМЕНТЫ DOM

    const trackAuthorDisplay = document.getElementById('current-track-author');

    const coverArt = document.getElementById('cover-art');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeFill = document.getElementById('volume-fill');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeDisplay = document.getElementById('current-time');
    const durationDisplay = document.getElementById('duration');
    const mainFavBtn = document.getElementById('main-favorite-btn');
    const notification = document.getElementById('notification');
    const notificationText = document.getElementById('notification-text');
    const loadingWave = document.getElementById('loading-wave');

    // ===================================================
    // УТИЛИТЫ
    // ===================================================
    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
    }

    function showNotification(text) {
        notificationText.textContent = text;
        notification.classList.add('show');
        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }

    function showLoading(show) {
        if (show) {
            loadingWave.classList.add('show');
        } else {
            loadingWave.classList.remove('show');
        }
    }

    // ===================================================
    // ЯЗЫК
    // ===================================================
    function switchLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        
        // Обновление активного пункта в меню
        document.querySelectorAll('.lang-option').forEach(option => {
            option.classList.remove('active');
            if (option.dataset.lang === lang) {
                option.classList.add('active');
            }
        });
        
        // Обновление текста на кнопке
        const langNameMap = {
            'kk': 'Қазақша',
            'ru': 'Русский',
            'en': 'English',
            'fr': 'Français',
            'zh': '简体中文'
        };
        document.getElementById('current-lang-text').textContent = langNameMap[lang] || 'Language';
        
        // Обновление всего текста
        document.querySelectorAll('[data-lang-key]').forEach(element => {
            const key = element.getAttribute('data-lang-key');
            if (translations[lang] && translations[lang][key]) {
                element.textContent = translations[lang][key];
            }
        });
        
        // Обновление списка треков
        updateTrackList();
        
        // Обновление текущего трека
        if (currentTrackIndex !== -1) {
            const track = tracks[currentTrackIndex];
            trackTitleDisplay.textContent = translations[lang][track.titleKey];
            trackAuthorDisplay.textContent = translations[lang][track.author];
        }
        
        closeLangDropdown();
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById('lang-dropdown');
        const btn = document.getElementById('lang-btn');
        dropdown.classList.toggle('show');
        btn.classList.toggle('active');
    }

    function closeLangDropdown() {
        const dropdown = document.getElementById('lang-dropdown');
        const btn = document.getElementById('lang-btn');
        dropdown.classList.remove('show');
        btn.classList.remove('active');
    }

    // ===================================================
    // СПИСОК ТРЕКОВ
    // ===================================================
    function updateTrackList() {
        const playlistContainer = document.getElementById('main-playlist-items');
        playlistContainer.innerHTML = '';

        let currentAuthorKey = null;

        tracks.forEach((track, index) => {
            const authorKey = track.author;
            
            // Добавляем заголовок автора
            if (authorKey !== currentAuthorKey) {
                const authorTitle = translations[currentLanguage][authorKey];
                const authorHeader = document.createElement('h4');
                authorHeader.className = 'playlist-author-header';
                authorHeader.innerHTML = `<i class="fas fa-user"></i> ${authorTitle}`;
                playlistContainer.appendChild(authorHeader);
                currentAuthorKey = authorKey;
            }

            const trackTitle = translations[currentLanguage][track.titleKey];
            const durationPlaceholder = index % 3 === 0 ? "3:49" : (index % 3 === 1 ? "2:34" : "2:16");
            const isPlaying = index === currentTrackIndex;
            const isFavorited = favorites.includes(track.id);
            
            const item = document.createElement('div');
            item.className = `playlist-item ${isPlaying ? 'playing' : ''}`;
            item.style.animationDelay = `${index * 0.05 + 0.3}s`;
            
            item.innerHTML = `
                <div class="item-index">${index + 1}</div>
                <div class="item-details" onclick="loadTrack(${index})">
                    <div class="item-title">${trackTitle}</div>
                </div>
                <div class="item-duration">${durationPlaceholder}</div>
                <button class="lyrics-btn" onclick="openLyricsModal(${index}, event)">
                    <i class="fas fa-file-lines"></i>
                </button>
                <button class="lyrics-btn" onclick="toggleFavoriteFromList(${track.id}, event)" style="margin-left: 5px;">
                    <i class="${isFavorited ? 'fas' : 'far'} fa-heart"></i>
                </button>
            `;
            
            playlistContainer.appendChild(item);
        });
    }

    // ===================================================
    // АУДИО ПЛЕЕР
    // ===================================================
    function loadTrack(index, autoplay = true) {
        if (index === currentTrackIndex && audioPlayer.src) {
            togglePlay();
            return;
        }

        currentTrackIndex = index;
        const track = tracks[index];
        
        showLoading(true);
        
        // Анимация перехода
        coverArt.style.opacity = '0.7';
        trackTitleDisplay.style.opacity = '0.7';
        
        setTimeout(() => {
            audioPlayer.src = track.src;
            coverImage.src = track.cover;
            trackTitleDisplay.textContent = translations[currentLanguage][track.titleKey];
            trackAuthorDisplay.textContent = translations[currentLanguage][track.author];
            
            if (autoplay) {
                audioPlayer.play().catch(e => {
                    console.log("Autoplay prevented:", e);
                    updatePlayButton(false);
                });
            }
            
            // Восстановление прозрачности
            coverArt.style.opacity = '1';
            trackTitleDisplay.style.opacity = '1';
            
            updateTrackList();
            updateFavoriteButton();
            showLoading(false);
        }, 300);
    }

    function togglePlay() {
        if (currentTrackIndex === -1) {
            loadTrack(0);
            return;
        }
        
        if (audioPlayer.paused) {
            audioPlayer.play();
        } else {
            audioPlayer.pause();
        }
    }
    
    function updatePlayButton(playing) {
        isPlaying = playing;
        playIcon.className = playing ? 'fas fa-pause' : 'fas fa-play';
        
        // Анимация обложки
        if (playing) {
            coverArt.classList.add('playing');
        } else {
            coverArt.classList.remove('playing');
        }
    }

    function playNext() {
        if (currentTrackIndex === -1) return loadTrack(0);
        const nextIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(nextIndex);
    }

    function playPrevious() {
        if (currentTrackIndex === -1) return loadTrack(0);
        if (audioPlayer.currentTime > 3) {
            audioPlayer.currentTime = 0;
            return;
        }
        const prevIndex = currentTrackIndex === 0 ? tracks.length - 1 : currentTrackIndex - 1;
        loadTrack(prevIndex);
    }

    // ===================================================
    // ИЗБРАННОЕ
    // ===================================================
    function toggleFavorite() {
        if (currentTrackIndex === -1) return;
        const trackId = tracks[currentTrackIndex].id;
        const index = favorites.indexOf(trackId);

        if (index === -1) {
            favorites.push(trackId);
            showNotification(translations[currentLanguage].added);
        } else {
            favorites.splice(index, 1);
            showNotification(translations[currentLanguage].removed);
        }
        
        localStorage.setItem('audioPlayerFavorites', JSON.stringify(favorites));
        updateFavoriteButton();
        updateTrackList();
    }
    
    function toggleFavoriteFromList(trackId, event) {
        event.stopPropagation();
        const index = favorites.indexOf(trackId);

        if (index === -1) {
            favorites.push(trackId);
            showNotification(translations[currentLanguage].added);
        } else {
            favorites.splice(index, 1);
            showNotification(translations[currentLanguage].removed);
        }
        
        localStorage.setItem('audioPlayerFavorites', JSON.stringify(favorites));
        
        // Обновляем обе кнопки
        updateFavoriteButton();
        updateTrackList();
    }
    
    function updateFavoriteButton() {
        if (!mainFavBtn || currentTrackIndex === -1) return;
        
        const trackId = tracks[currentTrackIndex].id;
        const isFavorited = favorites.includes(trackId);
        
        mainFavBtn.classList.toggle('favorited', isFavorited);
        mainFavBtn.querySelector('i').className = isFavorited ? 'fas fa-heart' : 'far fa-heart';
    }

    // ===================================================
    // ТЕКСТ ПЕСНИ
    // ===================================================
    function openLyricsModal(index, event) {
        if (event) event.stopPropagation();
        const modal = document.getElementById('lyrics-modal');
        const track = tracks[index];
        
        document.getElementById('lyrics-title').textContent = 
            translations[currentLanguage].lyricsTitle + translations[currentLanguage][track.titleKey];
        document.getElementById('lyrics-text').textContent = track.lyrics;
        
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    
    function closeLyricsModal() {
        const modal = document.getElementById('lyrics-modal');
        modal.classList.remove('show');
        document.body.style.overflow = 'auto';
    }

    // ===================================================
    // ОБРАБОТЧИКИ СОБЫТИЙ
    // ===================================================
    // Прогресс
    audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = audioPlayer.currentTime;
        const duration = audioPlayer.duration || 1;
        const percentage = (currentTime / duration) * 100;
        
        progressBar.value = percentage;
        progressFill.style.width = `${percentage}%`;
        currentTimeDisplay.textContent = formatTime(currentTime);
    });
    
    audioPlayer.addEventListener('loadedmetadata', () => {
        durationDisplay.textContent = formatTime(audioPlayer.duration);
    });

    // Перемотка
    progressBar.addEventListener('input', () => {
        const duration = audioPlayer.duration;
        audioPlayer.currentTime = (progressBar.value / 100) * duration;
    });

    // Громкость
    volumeSlider.addEventListener('input', () => {
        currentVolume = volumeSlider.value;
        audioPlayer.volume = currentVolume;
        volumeFill.style.transform = `scaleX(${currentVolume})`;
    });

    // Управление воспроизведением
    audioPlayer.addEventListener('play', () => updatePlayButton(true));
    audioPlayer.addEventListener('pause', () => updatePlayButton(false));
    audioPlayer.addEventListener('ended', playNext);
    audioPlayer.addEventListener('error', () => showLoading(false));

    // Закрытие выпадающих меню при клике вне
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.language-switcher')) {
            closeLangDropdown();
        }
        if (!e.target.closest('.lyrics-content-card') && e.target.closest('#lyrics-modal')) {
            closeLyricsModal();
        }
    });

    // Клавиши управления
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
        }
        if (e.code === 'ArrowRight') playNext();
        if (e.code === 'ArrowLeft') playPrevious();
    });

    // ===================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ===================================================
    document.addEventListener('DOMContentLoaded', () => {
        // Язык
        switchLanguage(currentLanguage);
        
        // Инициализация громкости
        volumeSlider.value = currentVolume;
        volumeFill.style.transform = `scaleX(${currentVolume})`;
        audioPlayer.volume = currentVolume;
        
        // Загрузка первого трека для показа
        if (tracks.length > 0) {
            const track = tracks[0];
            coverImage.src = track.cover;
            coverImage.style.opacity = '1';
            updateTrackList();
        }
        
        // Инициализация языкового меню
        document.getElementById('lang-btn').addEventListener('click', toggleLangDropdown);
        document.querySelectorAll('.lang-option').forEach(option => {
            option.addEventListener('click', () => switchLanguage(option.dataset.lang));
        });
        
        // Запуск анимаций после загрузки
        setTimeout(() => {
            document.body.style.opacity = 1;
        }, 100);
    });
</script>
</body>
</html>
