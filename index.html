<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UMIT | Минималистичный плеер</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      color: #efeff1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .player {
      max-width: 560px;
      width: 100%;
      background: rgba(16, 16, 22, 0.9);
      backdrop-filter: blur(24px);
      border-radius: 40px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #b03cff, #7b1fff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    #langBtn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    #langBtn:hover { background: rgba(176,60,255,0.2); }
    .chevron { font-size: 0.65rem; transition: transform 0.2s; }
    #langBtn.open .chevron { transform: rotate(180deg); }
    #langDd {
      position: fixed;
      z-index: 9999;
      background: #1a1a24;
      border: 1px solid rgba(176,60,255,0.3);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      transform: scale(0.92) translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    #langDd.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    .lang-opt {
      padding: 8px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: 0.1s;
    }
    .lang-opt:hover { background: rgba(176,60,255,0.2); }
    .lang-opt.active { background: rgba(176,60,255,0.3); color: #b03cff; }

    .media-row {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
      align-items: center;
    }
    .cover {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      background: #2a2a30;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .track-author {
      font-size: 0.85rem;
      color: #aaa;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .time-lbl {
      font-size: 0.7rem;
      color: #aaa;
      font-variant-numeric: tabular-nums;
      min-width: 38px;
    }
    .time-lbl.r { text-align: right; }
    input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: #2c2c34;
      border-radius: 4px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(176,60,255,0.5);
    }
    #progress-bar {
      background: linear-gradient(to right, #b03cff var(--pct, 0%), #2c2c34 var(--pct, 0%));
    }
    #volume-slider {
      background: linear-gradient(to right, #b03cff var(--vpct, 100%), #2c2c34 var(--vpct, 100%));
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: #ddd;
      font-size: 1.2rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:active { transform: scale(0.92); }
    .ctrl-btn.play {
      background: #b03cff;
      color: white;
      font-size: 1.4rem;
      width: 56px;
      height: 56px;
      box-shadow: 0 4px 12px rgba(176,60,255,0.4);
    }
    .ctrl-btn.active { color: #b03cff; }
    .ctrl-btn.active i { color: #b03cff; }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .vol-ic { color: #aaa; font-size: 0.8rem; width: 24px; }

    .playlist-tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 0;
    }
    .tab-btn.active {
      color: #b03cff;
      border-bottom: 2px solid #b03cff;
      margin-bottom: -11px;
      padding-bottom: 9px;
    }
    #playlistContainer {
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .author-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #b03cff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 8px;
    }
    .pl-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 6px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .pl-item:hover { background: rgba(176,60,255,0.08); }
    .pl-item.playing { background: rgba(176,60,255,0.12); }
    .pl-item.playing .pl-title { color: #b03cff; font-weight: 600; }
    .pl-thumb {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: #2a2a30;
    }
    .pl-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pl-meta { flex: 1; min-width: 0; }
    .pl-title {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl-dur {
      font-size: 0.7rem;
      color: #888;
      min-width: 36px;
      text-align: right;
    }
    .lyr-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 0.8rem;
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }
    .lyr-btn:hover { color: #b03cff; background: rgba(176,60,255,0.1); }
    .empty-fav {
      text-align: center;
      padding: 32px 16px;
      color: #888;
      font-size: 0.85rem;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    .modal-bg.show {
      opacity: 1;
      pointer-events: all;
    }
    .modal-card {
      background: #1a1a24;
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      transform: translateY(100%);
      transition: 0.3s;
    }
    .modal-bg.show .modal-card {
      transform: translateY(0);
    }
    .modal-hdr {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-close {
      background: none;
      border: none;
      color: #b03cff;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #lyrics-text {
      color: #ccc;
      line-height: 1.5;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #b03cff;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.8rem;
      opacity: 0;
      transition: 0.2s;
      z-index: 10001;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #b03cff; border-radius: 4px; }
  </style>
</head>
<body>

<div id="langDd"></div>
<div class="player">
  <div class="top-bar">
    <div class="logo">UMIT Player</div>
    <button id="langBtn"><span id="langLabel">Русский</span> <i class="fas fa-chevron-down chevron"></i></button>
  </div>

  <div class="media-row">
    <div class="cover" id="coverWrap">
      <img id="coverImg" src="" alt="cover">
    </div>
    <div class="track-info">
      <div class="track-title" id="trackTitle">Выберите трек</div>
      <div class="track-author" id="trackAuthor">UMIT</div>
    </div>
  </div>

  <div class="progress-row">
    <span class="time-lbl" id="curTime">0:00</span>
    <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.01">
    <span class="time-lbl r" id="durTime">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-shuffle"></i></button>
    <button class="ctrl-btn" id="repeatBtn"><i class="fas fa-repeat"></i><span id="repeatBadge" style="display: none; font-size: 10px; margin-left: 2px;">1</span></button>
    <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
    <button class="ctrl-btn play" id="playBtn"><i class="fas fa-play" id="playIcon"></i></button>
    <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
    <button class="ctrl-btn" id="favBtn"><i class="far fa-heart"></i></button>
  </div>

  <div class="volume-row">
    <i class="fas fa-volume-off vol-ic"></i>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
    <i class="fas fa-volume-high vol-ic"></i>
  </div>

  <div class="playlist-tabs">
    <button class="tab-btn active" data-tab="all" data-key="songsList">📋 Все песни</button>
    <button class="tab-btn" data-tab="fav" data-key="favTab">❤️ Избранное</button>
  </div>
  <div id="playlistContainer"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-hdr">
      <span class="modal-title" data-key="lyricsTitle">Текст песни</span>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="lyrics-text"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // ========== i18n ==========
  const I18N = {
    ru: { title:"UMIT Плеер", selectTrack:"Выберите трек", songsList:"📋 Все песни", favTab:"❤️ Избранное", lyricsTitle:"Текст песни", added:"Добавлено ♥", removed:"Удалено", emptyFav:"Нет избранных треков",
      s1:"Орта жүз", s2:"Жарылғап батыр", s3:"Тегімнің рухы", s4:"Қалжыр", s5:"Қалжыр 2", s6:"Wedding Fog", s7:"Wedding Fog 2", s8:"Along the Roads", s9:"Анашым", s10:"Көктем", s11:"Туған туыс бақытым",
      a1:"Қабыкенов Сағыныш", a2:"Рамазанов Төреғали" },
    kk: { title:"UMIT Плеєрі", selectTrack:"Тректі таңдаңыз", songsList:"📋 Барлық әндер", favTab:"❤️ Таңдаулылар", lyricsTitle:"Ән мәтіні", added:"Қосылды ♥", removed:"Жойылды", emptyFav:"Таңдаулы әндер жоқ",
      s1:"Орта жүз", s2:"Жарылғап батыр", s3:"Тегімнің рухы", s4:"Қалжыр", s5:"Қалжыр 2", s6:"Wedding Fog", s7:"Wedding Fog 2", s8:"Along the Roads", s9:"Анашым", s10:"Көктем", s11:"Туған туыс бақытым",
      a1:"Қабыкенов Сағыныш", a2:"Рамазанов Төреғали" },
    en: { title:"UMIT Player", selectTrack:"Select a track", songsList:"📋 All songs", favTab:"❤️ Favorites", lyricsTitle:"Lyrics", added:"Added ♥", removed:"Removed", emptyFav:"No favorite tracks",
      s1:"Middle Zhuz", s2:"Zharylghap Batyr", s3:"Spirit of My Lineage", s4:"Kalzhyr", s5:"Kalzhyr 2", s6:"Wedding Fog", s7:"Wedding Fog 2", s8:"Along the Roads", s9:"Anashym", s10:"Spring", s11:"My Native Happiness",
      a1:"Kabikenov Sagynysh", a2:"Ramazanov Toreghali" },
    fr: { title:"UMIT Lecteur", selectTrack:"Choisissez une piste", songsList:"📋 Toutes les chansons", favTab:"❤️ Favoris", lyricsTitle:"Paroles", added:"Ajouté ♥", removed:"Supprimé", emptyFav:"Aucun favori",
      s1:"Juz du Milieu", s2:"Zharylghap Batyr", s3:"Esprit de ma lignée", s4:"Kalzhyr", s5:"Kalzhyr 2", s6:"Wedding Fog", s7:"Wedding Fog 2", s8:"Along the Roads", s9:"Anashym", s10:"Printemps", s11:"Mon bonheur natal",
      a1:"Kabikenov Sagynysh", a2:"Ramazanov Toreghali" },
    zh: { title:"UMIT 播放器", selectTrack:"选择曲目", songsList:"📋 所有歌曲", favTab:"❤️ 收藏", lyricsTitle:"歌词", added:"已添加 ♥", removed:"已删除", emptyFav:"暂无收藏歌曲",
      s1:"中玉兹", s2:"扎里尔哈普·巴蒂尔", s3:"我的血统精神", s4:"卡尔日尔", s5:"卡尔日尔2", s6:"婚礼雾", s7:"婚礼雾2", s8:"沿途", s9:"阿纳希姆", s10:"春天", s11:"我的原生幸福",
      a1:"卡比肯诺夫·萨格尼什", a2:"拉马扎诺夫·托雷加利" }
  };
  const LANG_NAMES = { kk:"Қазақша", ru:"Русский", en:"English", fr:"Français", zh:"简体中文" };
  const TRACKS = [
    { tk:"s1", src:"orta_juz_audio.mp3", cover:"orta_juz.jpg", author:"a1", lyrics:"Орта жүз — мәтін...\nТекст песни орта жүз." },
    { tk:"s2", src:"jarylgap_batyr_audio.mp3", cover:"jarylgap_batyr.jpg", author:"a1", lyrics:"Жарылғап батыр — мәтін..." },
    { tk:"s3", src:"tegimnin_ruhy_audio.mp3", cover:"tegimnin_ruhy.jpg", author:"a1", lyrics:"Тегімнің рухы — мәтін..." },
    { tk:"s4", src:"Kalzhyr.mp3", cover:"Kalzhyr.jpg", author:"a1", lyrics:"Қалжыр — мәтін..." },
    { tk:"s5", src:"Kalzhyr2.mp3", cover:"Kalzhyr2.jpg", author:"a1", lyrics:"Қалжыр 2 — мәтін..." },
    { tk:"s6", src:"Wedding_fog.mp3", cover:"Wedding_fog.jpg", author:"a1", lyrics:"Wedding Fog lyrics..." },
    { tk:"s7", src:"Wedding_fog2.mp3", cover:"Wedding_fog2.jpg", author:"a1", lyrics:"Wedding Fog 2 lyrics..." },
    { tk:"s8", src:"Along_the_roads.mp3", cover:"Along_the_roads.jpg", author:"a1", lyrics:"Along the roads lyrics..." },
    { tk:"s9", src:"Anashym.mp3", cover:"Anashym.jpg", author:"a1", lyrics:"Анашым, анашым, сен менің анашым..." },
    { tk:"s10", src:"Koktem_audio.mp3", cover:"Koktem.jpg", author:"a2", lyrics:"Көктем — мәтін..." },
    { tk:"s11", src:"Tuğan_tūyıs_baqytym.mp3", cover:"Tūğan_tūyıs_baqytym.jpg", author:"a2", lyrics:"Туған туыс бақытым — мәтін..." }
  ];

  let lang = localStorage.getItem('umit_lang') || 'ru';
  let curIdx = -1, shuffle = false, repeatState = 0, currentTab = 'all';
  let favs = JSON.parse(localStorage.getItem('umit_favs') || '[]');
  let durations = {};
  const audio = new Audio();
  const T = () => I18N[lang];
  const fmt = s => isNaN(s) ? '0:00' : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  function showToast(msg) { let t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }

  // Сохранение состояния
  function saveState() {
    if(curIdx<0) return;
    localStorage.setItem('umit_player_state', JSON.stringify({
      curIdx, currentTime: audio.currentTime||0, isPlaying: !audio.paused,
      volume: audio.volume, shuffle, repeat: repeatState, lang, favs
    }));
  }
  function restoreState() {
    let s = localStorage.getItem('umit_player_state');
    if(!s) return;
    try {
      let d = JSON.parse(s);
      if(d.lang && I18N[d.lang]) lang = d.lang;
      if(d.favs) favs = d.favs;
      shuffle = d.shuffle || false;
      repeatState = d.repeat || 0;
      if(d.volume !== undefined) { audio.volume = d.volume; document.getElementById('volume-slider').value = d.volume; updateVolGrad(); }
      if(d.curIdx>=0 && d.curIdx<TRACKS.length) {
        curIdx = d.curIdx;
        let tr = TRACKS[curIdx];
        audio.src = tr.src;
        document.getElementById('coverImg').src = tr.cover;
        document.getElementById('trackTitle').innerText = T()[tr.tk];
        document.getElementById('trackAuthor').innerText = T()[tr.author];
        audio.load();
        audio.addEventListener('loadedmetadata', ()=>{
          if(d.currentTime && d.currentTime<audio.duration) audio.currentTime = d.currentTime;
          if(d.isPlaying) audio.play().catch(e=>console.log);
          else setPlaying(false);
          updateFavBtn();
          renderPlaylist();
          updateMediaSession();
        }, {once:true});
      }
      updateShuffleUI();
      updateRepeatUI();
      applyLang();
    } catch(e) {}
  }

  const playIcon = document.getElementById('playIcon');
  const coverImg = document.getElementById('coverImg');
  const prog = document.getElementById('progress-bar');
  const volSlider = document.getElementById('volume-slider');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  function setPlaying(on) {
    playIcon.className = on ? 'fas fa-pause' : 'fas fa-play';
    if(navigator.mediaSession) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
    saveState();
  }
  function loadTrack(idx) {
    if(idx===curIdx && !audio.paused) { togglePlay(); return; }
    curIdx = idx;
    let tr = TRACKS[idx];
    audio.src = tr.src;
    coverImg.src = tr.cover;
    document.getElementById('trackTitle').innerText = T()[tr.tk];
    document.getElementById('trackAuthor').innerText = T()[tr.author];
    prog.value = 0; prog.style.setProperty('--pct','0%');
    curTimeEl.innerText = '0:00';
    durTimeEl.innerText = durations[idx] ? fmt(durations[idx]) : '0:00';
    audio.load();
    audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false));
    renderPlaylist();
    updateFavBtn();
    updateMediaSession();
    saveState();
  }
  function togglePlay() { if(curIdx<0) loadTrack(0); else audio.paused ? audio.play() : audio.pause(); }
  function nextTrack() {
    if(repeatState===1) { audio.currentTime=0; audio.play(); return; }
    let next = shuffle ? (()=>{ let x; do x=Math.floor(Math.random()*TRACKS.length); while(x===curIdx && TRACKS.length>1); return x; })() : (curIdx+1)%TRACKS.length;
    if(next===0 && curIdx===TRACKS.length-1 && repeatState!==2) { setPlaying(false); audio.currentTime=0; return; }
    loadTrack(next);
  }
  function prevTrack() {
    if(curIdx<0) loadTrack(TRACKS.length-1);
    else if(audio.currentTime>3) audio.currentTime=0;
    else loadTrack((curIdx-1+TRACKS.length)%TRACKS.length);
  }
  function updateRepeatUI() {
    let btn=document.getElementById('repeatBtn'), badge=document.getElementById('repeatBadge');
    btn.classList.remove('active'); badge.style.display='none';
    if(repeatState===1) { btn.classList.add('active'); badge.style.display='inline'; badge.innerText='1'; }
    else if(repeatState===2) btn.classList.add('active');
  }
  function cycleRepeat() { repeatState=(repeatState+1)%3; updateRepeatUI(); saveState(); showToast(['Повтор выкл','Повтор трека','Повтор плейлиста'][repeatState]); }
  function updateShuffleUI() { document.getElementById('shuffleBtn').classList.toggle('active', shuffle); }
  function toggleFav() {
    let i=favs.indexOf(curIdx);
    if(i<0) { favs.push(curIdx); showToast(T().added); }
    else { favs.splice(i,1); showToast(T().removed); }
    localStorage.setItem('umit_favs',JSON.stringify(favs));
    updateFavBtn(); renderPlaylist(); saveState();
  }
  function updateFavBtn() { document.getElementById('favBtn').querySelector('i').className = favs.includes(curIdx) ? 'fas fa-heart' : 'far fa-heart'; }
  function updateVolGrad() { volSlider.style.setProperty('--vpct', (volSlider.value*100).toFixed(1)+'%'); }
  function updateMediaSession() {
    if(!navigator.mediaSession) return;
    let tr=TRACKS[curIdx];
    navigator.mediaSession.metadata = new MediaMetadata({ title: T()[tr.tk], artist: T()[tr.author], artwork: [{ src: tr.cover }] });
  }

  function renderPlaylist() {
    let container = document.getElementById('playlistContainer');
    container.innerHTML = '';
    let list = currentTab==='all' ? TRACKS.map((_,i)=>i) : favs.filter(i=>i>=0&&i<TRACKS.length);
    if(list.length===0 && currentTab==='fav') { let d=document.createElement('div'); d.className='empty-fav'; d.innerText=T().emptyFav; container.appendChild(d); return; }
    let lastA=null;
    for(let idx of list) {
      let tr=TRACKS[idx];
      if(tr.author !== lastA) {
        let lbl=document.createElement('div'); lbl.className='author-label'; lbl.innerText=T()[tr.author];
        container.appendChild(lbl); lastA=tr.author;
      }
      let item=document.createElement('div');
      item.className='pl-item'+(idx===curIdx?' playing':'');
      item.innerHTML = `
        <div class="pl-thumb"><img src="${tr.cover}" loading="lazy"></div>
        <div class="pl-meta"><div class="pl-title">${T()[tr.tk]}</div></div>
        <span class="pl-dur">${durations[idx]?fmt(durations[idx]):'—:——'}</span>
        <button class="lyr-btn" data-i="${idx}"><i class="fas fa-file-lines"></i></button>
      `;
      item.addEventListener('click', e=>{ if(!e.target.closest('.lyr-btn')) loadTrack(idx); });
      item.querySelector('.lyr-btn').addEventListener('click', e=>{ e.stopPropagation(); openModal(idx); });
      container.appendChild(item);
    }
  }
  function openModal(i) {
    let tr=TRACKS[i];
    document.getElementById('lyrics-text').innerText = tr.lyrics||'—';
    document.getElementById('modalBg').classList.add('show');
  }
  function closeModal() { document.getElementById('modalBg').classList.remove('show'); }

  function applyLang() {
    // Обновляем текст кнопки языка
    document.getElementById('langLabel').innerText = LANG_NAMES[lang];
    // Обновляем активный класс в дропдауне
    document.querySelectorAll('.lang-opt').forEach(o=>o.classList.toggle('active',o.dataset.lang===lang));
    // Обновляем все элементы с data-key
    document.querySelectorAll('[data-key]').forEach(el => {
      let key = el.dataset.key;
      if(T()[key]) el.innerText = T()[key];
    });
    // Обновляем текущий трек, если он выбран
    if(curIdx>=0) {
      document.getElementById('trackTitle').innerText = T()[TRACKS[curIdx].tk];
      document.getElementById('trackAuthor').innerText = T()[TRACKS[curIdx].author];
      updateMediaSession();
    }
    // Перерисовываем плейлист (чтобы обновить названия треков и авторов)
    renderPlaylist();
  }

  audio.addEventListener('timeupdate',()=>{ if(audio.duration){ let p=audio.currentTime/audio.duration*100; prog.value=p; prog.style.setProperty('--pct',p+'%'); curTimeEl.innerText=fmt(audio.currentTime); } });
  audio.addEventListener('loadedmetadata',()=>{ durTimeEl.innerText=fmt(audio.duration); if(curIdx>=0&&audio.duration) durations[curIdx]=audio.duration; renderPlaylist(); });
  audio.addEventListener('ended',nextTrack);
  audio.addEventListener('play',()=>setPlaying(true));
  audio.addEventListener('pause',()=>setPlaying(false));
  prog.addEventListener('input',()=>{ if(audio.duration) audio.currentTime = prog.value/100*audio.duration; });
  volSlider.addEventListener('input',()=>{ audio.volume=volSlider.value; updateVolGrad(); saveState(); });

  document.getElementById('shuffleBtn').onclick=()=>{ shuffle=!shuffle; updateShuffleUI(); saveState(); showToast(shuffle?'Перемешивание вкл':'Перемешивание выкл'); };
  document.getElementById('repeatBtn').onclick=cycleRepeat;
  document.getElementById('prevBtn').onclick=prevTrack;
  document.getElementById('nextBtn').onclick=nextTrack;
  document.getElementById('playBtn').onclick=togglePlay;
  document.getElementById('favBtn').onclick=toggleFav;
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>{ currentTab=btn.dataset.tab; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderPlaylist(); });

  // Language dropdown
  const langBtn = document.getElementById('langBtn'), langDd = document.getElementById('langDd');
  function buildLangMenu() {
    langDd.innerHTML = '';
    Object.keys(LANG_NAMES).forEach(code=>{
      let opt = document.createElement('div'); opt.className='lang-opt'+(lang===code?' active':''); opt.dataset.lang=code;
      opt.innerHTML = (code==='kk'?'🇰🇿':code==='ru'?'🇷🇺':code==='en'?'🇺🇸':code==='fr'?'🇫🇷':'🇨🇳')+' '+LANG_NAMES[code];
      opt.onclick = (e)=>{ e.stopPropagation(); lang=code; localStorage.setItem('umit_lang',lang); applyLang(); closeDd(); saveState(); };
      langDd.appendChild(opt);
    });
  }
  function posDd(){ let r=langBtn.getBoundingClientRect(); langDd.style.top=r.bottom+8+'px'; langDd.style.right=window.innerWidth-r.right+'px'; }
  function openDd(){ posDd(); langDd.classList.add('open'); langBtn.classList.add('open'); }
  function closeDd(){ langDd.classList.remove('open'); langBtn.classList.remove('open'); }
  langBtn.onclick = (e)=>{ e.stopPropagation(); if(langDd.classList.contains('open')) closeDd(); else openDd(); };
  document.addEventListener('click', e=>{ if(!langDd.contains(e.target) && e.target!==langBtn) closeDd(); });
  window.addEventListener('resize',()=>{ if(langDd.classList.contains('open')) posDd(); });

  buildLangMenu();
  applyLang();
  updateVolGrad();
  if(navigator.mediaSession) {
    navigator.mediaSession.setActionHandler('play',togglePlay);
    navigator.mediaSession.setActionHandler('pause',togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack',prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack',nextTrack);
  }
  restoreState();
  if(curIdx===-1 && TRACKS.length) loadTrack(0);
  setInterval(()=>{ if(curIdx!==-1 && !audio.paused) saveState(); }, 5000);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.code==='Space'){ e.preventDefault(); togglePlay(); } });
</script>
</body>
</html>
