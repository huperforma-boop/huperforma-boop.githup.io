<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMIT | Мобильный Плеер Glass</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ===== ПЕРЕМЕННЫЕ И СБРОС СТИЛЕЙ ===== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary-color: #ffffff;
            --accent-color: #007aff; /* iOS Blue */
            --background: #1c1c1e; /* Dark iOS background */
            --text-color: #fff;
            --secondary-text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Изменено для мобильного скролла */
            padding: 20px 10px;
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР (МОБИЛЬНЫЙ ВИД) ===== */
        .mobile-container {
            width: 100%;
            max-width: 420px; /* Типичная ширина для мобильных */
            margin-top: 20px;
        }

        /* ===== ЭЛЕМЕНТЫ GLASSMORPHISM ===== */
        .glass-card {
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 4px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-bottom: 20px;
        }

        /* ===== ШАПКА И ЯЗЫК ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .language-switcher button {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .language-switcher button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ===== ПЛЕЕР ===== */
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* ОБЛОЖКА */
        .cover-art {
            width: 100%;
            max-width: 300px;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease-out;
        }
        
        /* ИНФОРМАЦИЯ О ТРЕКЕ */
        .track-info {
            text-align: center;
            width: 100%;
        }
        
        #current-track-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        #current-track-author {
            font-size: 1rem;
            color: var(--secondary-text);
        }

        /* ПРОГРЕСС И ВРЕМЯ */
        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-top: 10px;
        }

        .time-display {
            font-size: 0.85rem;
            color: var(--secondary-text);
            min-width: 35px;
        }

        #progress-bar {
            flex-grow: 1;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
        }
        
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        /* ОСНОВНЫЕ КНОПКИ УПРАВЛЕНИЯ */
        .main-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:active {
            transform: scale(0.9);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .control-btn.play-pause {
            width: 70px;
            height: 70px;
            background: var(--accent-color);
            color: var(--primary-color);
            border: none;
            font-size: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 122, 255, 0.5);
        }

        /* ГРОМКОСТЬ */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 0;
            opacity: 0.7;
        }

        .volume-container i {
            font-size: 1.1rem;
            color: var(--secondary-text);
        }

        #volume-slider {
            flex-grow: 1;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
        }
        
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
        }
        
        /* ===== СПИСОК ПЕСЕН ===== */
        .playlist-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        /* НОВЫЙ СТИЛЬ: Заголовок Автора */
        .playlist-author-header {
            font-size: 1rem;
            font-weight: 700;
            color: var(--secondary-text); /* Немного приглушенный цвет */
            margin-top: 20px;
            margin-bottom: 5px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.8;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.1s;
        }

        .playlist-item:last-child {
            border-bottom: none; /* Убираем линию после последнего элемента */
        }
        
        /* Убираем линию после элемента, если следующим идет заголовок автора (сложно реализовать в чистом CSS, оставим как есть или уберем в JS) */
        
        .playlist-item:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.playing .item-title {
            color: var(--accent-color);
            font-weight: 600;
        }

        .item-index {
            width: 20px;
            font-size: 0.9rem;
            color: var(--secondary-text);
            text-align: center;
        }
        
        .item-details {
            flex-grow: 1;
            padding: 0 15px;
        }

        .item-title {
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-duration {
            font-size: 0.8rem;
            color: var(--secondary-text);
        }

        /* ===== ТЕКСТ ПЕСНИ (МОДАЛЬНОЕ ОКНО) ===== */
        .lyrics-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none; /* Скрыто по умолчанию */
            justify-content: center;
            align-items: flex-end; /* Появление снизу */
        }
        
        .lyrics-modal.show {
            display: flex;
        }

        .lyrics-content-card {
            width: 100%;
            max-width: 500px;
            height: 80%;
            background: var(--glass-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 30px 20px;
            overflow-y: auto;
            position: relative;
            transform: translateY(100%);
            animation: slideUp 0.3s forwards;
        }
        
        @keyframes slideUp {
            to { transform: translateY(0); }
        }

        .lyrics-content-card h3 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .lyrics-content-card p {
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        
        .lyrics-close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
        }
        
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="header">
            <h1 data-lang-key="title">Аудио Плеер</h1>
            <div class="language-switcher">
                 <button id="lang-btn" onclick="toggleLangDropdown(event)">
                    <span id="current-lang-text">Русский</span> <i class="fas fa-chevron-down"></i>
                </button>
                
                <div class="glass-card lang-dropdown" id="lang-dropdown" style="display: none; position: absolute; right: 10px; z-index: 10; padding: 10px; min-width: 150px;">
                    <div class="lang-option" onclick="switchLanguage('kk', event)">🇰🇿 Қазақша</div>
                    <div class="lang-option active" onclick="switchLanguage('ru', event)">🇷🇺 Русский</div>
                    <div class="lang-option" onclick="switchLanguage('en', event)">🇺🇸 English</div>
                    <div class="lang-option" onclick="switchLanguage('fr', event)">🇫🇷 Français</div>
                    <div class="lang-option" onclick="switchLanguage('zh', event)">🇨🇳 简体中文</div>
                </div>
            </div>
        </div>

        <div class="glass-card player-card">
            
            <audio id="global-audio-player" src="" preload="metadata"></audio>

            <div class="cover-art">
                <img id="track-cover" src="" alt="Track Cover" style="display: block;">
            </div>

            <div class="track-info">
                <h2 id="current-track-title" data-lang-key="selectTrack">Выберите трек</h2>
                <p id="current-track-author">UMIT Project</p>
            </div>
            
            <div class="progress-container">
                <span id="current-time" class="time-display">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <span id="duration" class="time-display">0:00</span>
            </div>

            <div class="main-controls">
                <button class="control-btn" onclick="playPrevious()">
                    <i class="fas fa-backward"></i>
                </button>
                <button class="control-btn play-pause" id="main-play-btn" onclick="togglePlay()">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" onclick="playNext()">
                    <i class="fas fa-forward"></i>
                </button>
            </div>
            
            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                <i class="fas fa-volume-up"></i>
            </div>
            
            <button class="control-btn" id="main-favorite-btn" onclick="toggleFavorite()" style="margin-top: 10px;">
                 <i class="far fa-heart"></i>
            </button>
        </div>

        <div class="glass-card">
            <h3 class="playlist-header" data-lang-key="songsList">Список песен</h3>
            <div id="main-playlist-items" class="playlist-items">
                </div>
        </div>

    </div>

    <div class="lyrics-modal" id="lyrics-modal" onclick="closeLyricsModal(event)">
        <div class="lyrics-content-card" onclick="event.stopPropagation()">
            <button class="lyrics-close-btn" onclick="closeLyricsModal()">
                <i class="fas fa-times"></i>
            </button>
            <h3 id="lyrics-title">Текст песни</h3>
            <p id="lyrics-text">Текст загружается...</p>
        </div>
    </div>


<script>

    // ===================================================

    let currentLanguage = localStorage.getItem('language') || 'ru';
    let currentTrackIndex = -1;
    let favorites = JSON.parse(localStorage.getItem('audioPlayerFavorites')) || [];

        },

        },
        zh: {

            "selectTrack": "选择曲目",
            "lyrics": "歌词",
            "songsList": "歌曲列表:",

        }
    };

    // 10 МУЗЫКАЛЬНЫХ ТРЕКОВ И ИХ КАРТИНКИ
    const tracks = [
        // Треки от Қабыкенов Сағыныш (1-8)
        { titleKey: "song1", src: "orta_juz_audio.mp3", cover: "orta_juz.jpg", id: 0, author: "author1", lyrics: "Текст песни 1 (Орта жүз) \n\n" },
        { titleKey: "song2", src: "jarylgap_batyr_audio.mp3", cover: "jarylgap_batyr.jpg", id: 1, author: "author1", lyrics: "Текст песни 2 (Жарылғап батыр) \n\n" },
        { titleKey: "song3", src: "tegimnin_ruhy_audio.mp3", cover: "tegimnin_ruhy.jpg", id: 2, author: "author1", lyrics: "Текст песни 3 (Тегімнің рухы) \n\n" },
        { titleKey: "song4", src: "Kalzhyr.mp3", cover: "Kalzhyr.jpg", id: 3, author: "author1", lyrics: "Текст песни 4 (Қалжыр) \n\n" },
        { titleKey: "song5", src: "Kalzhyr2.mp3", cover: "Kalzhyr2.jpg", id: 4, author: "author1", lyrics: "Текст песни 5 (Қалжыр2) \n\n" },
        { titleKey: "song6", src: "Wedding_fog.mp3", cover: "Wedding_fog.jpg", id: 5, author: "author1", lyrics: "Текст песни 6 (Wedding_fog) \n\n" },
        { titleKey: "song7", src: "Wedding_fog2.mp3", cover: "Wedding_fog2.jpg", id: 6, author: "author1", lyrics: "Текст песни 7 (Wedding_fog2) \n\n" },
        { titleKey: "song8", src: "Along_the_roads.mp3", cover: "Along_the_roads.jpg", id: 7, author: "author1", lyrics: "Текст песни 8 (Along_the_roads) \n\n" },
        // Треки от Рамазанов Төреғали (9-10)
        { titleKey: "song9", src: "Koktem_audio.mp3", cover: "Koktem.jpg", id: 8, author: "author2", lyrics: "Текст песни 9 (Көктем) \n\n" },
        { titleKey: "song10", src: "Tuğan_tūyıs_baqytym.mp3", cover: "Tūğan_tūyıs_baqytym.jpg", id: 9, author: "author2", lyrics: "Текст песни 10 (Туған туыс бақытым) \n\n" },
    ];


    // ===================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ===================================================

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
    }

    // ===================================================
    // ЯЗЫК
    // ===================================================

    function switchLanguage(lang, event) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        
        // Обновление кнопок
        document.querySelectorAll('.lang-dropdown .lang-option').forEach(option => {
            option.classList.remove('active');
        });
        if (event && event.target.classList.contains('lang-option')) event.target.classList.add('active');

        // Обновление текста
        document.querySelectorAll('[data-lang-key]').forEach(element => {
            const key = element.getAttribute('data-lang-key');
            if (translations[lang] && translations[lang][key]) {
                element.textContent = translations[lang][key];
            }
        });
        
        // Обновление кнопки языка
        const currentLangDisplay = document.getElementById('current-lang-text');
        if (currentLangDisplay) {
            // Устанавливаем отображаемое название языка (например, "Русский")
            const langNameMap = {
                'kk': 'Қазақша',
                'ru': 'Русский',
                'en': 'English',
                'fr': 'Français',
                'zh': '简体中文'
            };
            currentLangDisplay.textContent = langNameMap[lang] || 'Language';
        }
        
        // Перерисовываем список треков, чтобы обновить названия и заголовки авторов
        updateTrackList();
        
        // Если трек выбран, обновляем его заголовок и автора
        if (currentTrackIndex !== -1) {
            const track = tracks[currentTrackIndex];
            document.getElementById('current-track-title').textContent = translations[currentLanguage][track.titleKey];
            document.getElementById('current-track-author').textContent = translations[currentLanguage][track.author];
        } else {
             document.getElementById('current-track-title').textContent = translations[currentLanguage].selectTrack;
             document.getElementById('current-track-author').textContent = "UMIT Project"; // Дефолтный автор
        }
        
        closeLangDropdown();
    }
    
    function toggleLangDropdown(event) {
        event.stopPropagation();
        const dropdown = document.getElementById('lang-dropdown');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
    
    function closeLangDropdown() {
        document.getElementById('lang-dropdown').style.display = 'none';
    }
    
    // Закрытие дропдауна при клике вне его
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('lang-dropdown');
        const langBtn = document.getElementById('lang-btn');
        if (dropdown && dropdown.style.display === 'block' && !dropdown.contains(event.target) && (!langBtn || !langBtn.contains(event.target))) {
            closeLangDropdown();
        }
    });

    // ===================================================
    // СПИСОК ТРЕКОВ (ПЕРЕРИСОВКА)
    // ===================================================

    function updateTrackList() {
        const playlistContainer = document.getElementById('main-playlist-items');
        playlistContainer.innerHTML = '';

        let currentAuthorKey = null;

        tracks.forEach((track, index) => {
            const authorKey = track.author;
            
            // Если автор изменился или это первый трек, добавляем заголовок автора
            if (authorKey !== currentAuthorKey) {
                const authorTitle = translations[currentLanguage][authorKey];
                const authorHeader = document.createElement('h4');
                authorHeader.className = 'playlist-author-header';
                authorHeader.textContent = authorTitle;
                playlistContainer.appendChild(authorHeader);
                currentAuthorKey = authorKey;
            }

            const trackTitle = translations[currentLanguage][track.titleKey];
            const item = document.createElement('div');
            item.className = 'playlist-item';
            if (index === currentTrackIndex) {
                item.classList.add('playing');
            }
            
            // Имитация длительности, т.к. аудио не загружено
            const durationPlaceholder = index % 3 === 0 ? "3:49" : (index % 3 === 1 ? "2:34" : "2:16");
            
            item.innerHTML = `
                <div class="item-index">${index + 1}</div>
                <div class="item-details" onclick="loadTrack(${index})">
                    <div class="item-title">${trackTitle}</div>
                </div>
                <div class="item-duration">${durationPlaceholder}</div>
                <button class="control-btn" style="width: 40px; height: 40px; margin-left: 10px;" onclick="openLyricsModal(${index}, event)">
                    <i class="fas fa-file-lines"></i>
                </button>
            `;
            
            playlistContainer.appendChild(item);
        });
    }


    // ===================================================
    // АУДИО ПЛЕЕР
    // ===================================================
    
    const audioPlayer = document.getElementById('global-audio-player');
    const playBtn = document.getElementById('main-play-btn');
    const playIcon = playBtn ? playBtn.querySelector('i') : null;
    const trackTitleDisplay = document.getElementById('current-track-title');
    const trackAuthorDisplay = document.getElementById('current-track-author');
    const coverImage = document.getElementById('track-cover');
    const volumeSlider = document.getElementById('volume-slider');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeDisplay = document.getElementById('current-time');
    const durationDisplay = document.getElementById('duration');
    const mainFavBtn = document.getElementById('main-favorite-btn');

    function loadTrack(index) {
        if (index === currentTrackIndex) {
            togglePlay(); // Если нажали на текущий трек, просто переключаем воспроизведение
            return;
        }

        currentTrackIndex = index;
        const track = tracks[index];
        const authorName = translations[currentLanguage][track.author];
        
        // Обновление данных
        audioPlayer.src = track.src;
        trackTitleDisplay.textContent = translations[currentLanguage][track.titleKey];
        trackAuthorDisplay.textContent = authorName; // Устанавливаем имя автора
        coverImage.src = track.cover;
        
        // Сброс и запуск
        audioPlayer.load();
        audioPlayer.play();
        
        // Обновление интерфейса
        updatePlayButton(true);
        updateTrackList();
        updateFavoriteButton();
    }

    function togglePlay() {
        if (currentTrackIndex === -1) {
            loadTrack(0); // Загружаем первый трек, если ничего не выбрано
            return;
        }
        
        if (audioPlayer.paused) {
            audioPlayer.play();
            updatePlayButton(true);
        } else {
            audioPlayer.pause();
            updatePlayButton(false);
        }
    }
    
    function updatePlayButton(isPlaying) {
        if (playIcon) {
            playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
        }
    }

    function playNext() {
        if (currentTrackIndex === -1) {
            loadTrack(0);
            return;
        }
        let nextIndex = currentTrackIndex + 1;
        if (nextIndex >= tracks.length) nextIndex = 0;
        loadTrack(nextIndex);
    } 

    function playPrevious() {
        if (currentTrackIndex === -1) {
            loadTrack(tracks.length - 1); // Начать с последнего, если ничего не выбрано
            return;
        }
        if (audioPlayer.currentTime < 3 && currentTrackIndex > 0) {
            let prevIndex = currentTrackIndex - 1;
            loadTrack(prevIndex);
        } else {
            audioPlayer.currentTime = 0; // Начать сначала, если проиграно > 3 секунд
        }
    }
    
    // ===================================================
    // ИЗБРАННОЕ
    // ===================================================

    function toggleFavorite() {
        if (currentTrackIndex === -1) return;
        const trackId = tracks[currentTrackIndex].id;
        const index = favorites.indexOf(trackId);

        if (index === -1) {
            favorites.push(trackId);
        } else {
            favorites.splice(index, 1);
        }
        
        localStorage.setItem('audioPlayerFavorites', JSON.stringify(favorites));
        updateFavoriteButton();
    }
    
    function updateFavoriteButton() {
        if (!mainFavBtn) return;
        
        if (currentTrackIndex === -1) {
             mainFavBtn.querySelector('i').className = 'far fa-heart';
             mainFavBtn.style.color = 'var(--text-color)';
             return;
        }
        const trackId = tracks[currentTrackIndex].id;
        const isFavorited = favorites.includes(trackId);
        
        mainFavBtn.querySelector('i').className = isFavorited ? 'fas fa-heart' : 'far fa-heart';
        mainFavBtn.style.color = isFavorited ? 'var(--accent-color)' : 'var(--text-color)';
    }

    // ===================================================
    // ТЕКСТ ПЕСНИ (МОДАЛЬНОЕ ОКНО)
    // ===================================================
    
    function openLyricsModal(index, event) {
        if (event) event.stopPropagation();
        const modal = document.getElementById('lyrics-modal');
        const track = tracks[index];
        
        document.getElementById('lyrics-title').textContent = translations[currentLanguage].lyricsTitle + translations[currentLanguage][track.titleKey];
        document.getElementById('lyrics-text').textContent = track.lyrics || "Текст не найден. \n\n (Файл index.html содержит только заглушки. Если вам нужен настоящий текст, вставьте его в поле 'lyrics' для каждого трека в JS-массиве.)";
        modal.classList.add('show');
    }
    
    function closeLyricsModal() {
        const modal = document.getElementById('lyrics-modal');
        modal.classList.remove('show');
    }

    // ===================================================
    // ОБРАБОТЧИКИ СОБЫТИЙ АУДИО
    // ===================================================

    // Обновление прогресс-бара и времени
    audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = audioPlayer.currentTime;
        const duration = audioPlayer.duration;
        
        if (progressBar) progressBar.value = (currentTime / duration) * 100 || 0;
        if (currentTimeDisplay) currentTimeDisplay.textContent = formatTime(currentTime);
    });
    
    // Обновление общей длительности
    audioPlayer.addEventListener('loadedmetadata', () => {
        if (durationDisplay) durationDisplay.textContent = formatTime(audioPlayer.duration);
        if (progressBar) progressBar.value = 0;
        if (currentTimeDisplay) currentTimeDisplay.textContent = "0:00";
    });

    // Автоматическое переключение на следующий трек
    audioPlayer.addEventListener('ended', () => {
        playNext();
    });

    // Перемотка
    if (progressBar) {
        progressBar.addEventListener('input', () => {
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (progressBar.value / 100) * duration;
        });
    }

    // Регулятор громкости
    if (volumeSlider) {
        volumeSlider.addEventListener('input', () => {
            audioPlayer.volume = volumeSlider.value;
        });
    }

    // ===================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ===================================================

    document.addEventListener('DOMContentLoaded', () => {
        // Установка начального языка и загрузка списка
        switchLanguage(currentLanguage);
        
        // Установка начального громкости
        if (volumeSlider) volumeSlider.value = audioPlayer.volume = 1;

        // Если есть избранные, обновляем кнопку
        updateFavoriteButton();
        
        // Загружаем первый трек для отображения обложки/данных
        if (tracks.length > 0) {
            loadTrack(0);
            audioPlayer.pause();
            updatePlayButton(false);
            
            // При первой загрузке показываем дефолтного автора UMIT Project, 
            // так как автор загруженного трека не актуален до нажатия Play
            document.getElementById('current-track-author').textContent = "UMIT Project";
        }
    });

</script>
</body>
</html>
