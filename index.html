<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UMIT | Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg:#09080f; --surface:#110f1e; --border:rgba(176,60,255,.18);
      --accent:#b03cff; --accent2:#7b1fff; --glow:rgba(176,60,255,.45);
      --text:#f0eeff; --muted:#9893b0;
      --ease:cubic-bezier(.4,0,.2,1); --fast:.18s; --med:.32s;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(176,60,255,.22) 0%,transparent 70%),
                 radial-gradient(ellipse 40% 40% at 85% 80%,rgba(100,20,200,.14) 0%,transparent 65%)}

    /* ЛЭЙАУТ */
    .layout{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:24px 16px 48px;display:grid;grid-template-columns:1fr;gap:20px}

    /* ХЕДЕР — только opacity, НИКАКИХ transform, чтобы не ломать position:fixed */
    .header{display:flex;justify-content:space-between;align-items:center;opacity:0;animation:fadeIn .5s var(--ease) .05s forwards}
    @keyframes fadeIn{to{opacity:1}}

    .logo{display:flex;align-items:center;gap:10px;font-family:'Unbounded',sans-serif;font-size:1.35rem;font-weight:900;letter-spacing:-.5px}
    .logo-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-size:1rem;box-shadow:0 0 20px var(--glow)}

    /* КНОПКА ЯЗЫКА */
    #langBtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:.85rem;font-family:'DM Sans',sans-serif;transition:background var(--fast)}
    #langBtn:hover{background:rgba(176,60,255,.15)}
    #langBtn .chevron{font-size:.7rem;color:var(--muted);transition:transform var(--med) var(--ease)}
    #langBtn.open .chevron{transform:rotate(180deg)}

    /* ДРОПДАУН — ПОРТАЛ, прямой child body, position:fixed, z-index выше всего */
    #langDd{
      position:fixed; /* координаты через JS */
      z-index:99999;
      min-width:175px;
      background:rgba(14,11,26,.98);
      border:1px solid rgba(176,60,255,.3);
      border-radius:16px;padding:8px;
      box-shadow:0 24px 64px rgba(0,0,0,.85),0 0 0 1px rgba(176,60,255,.1);
      transform-origin:top right;
      transform:scale(.88) translateY(-10px);
      opacity:0;pointer-events:none;
      transition:transform var(--med) var(--ease),opacity var(--med) var(--ease);
    }
    #langDd.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}
    .lang-opt{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;white-space:nowrap;transition:background var(--fast)}
    .lang-opt:hover{background:rgba(176,60,255,.18)}
    .lang-opt:active{background:rgba(176,60,255,.3)}
    .lang-opt.active{background:rgba(176,60,255,.22);color:var(--accent);font-weight:600}

    /* КАРТОЧКА */
    .card{background:rgba(17,15,30,.65);border:1px solid var(--border);border-radius:24px;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 4px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);padding:24px;opacity:0;animation:fadeIn .5s var(--ease) forwards}
    .card:nth-of-type(1){animation-delay:.12s}
    .card:nth-of-type(2){animation-delay:.22s}

    /* ПЛЕЕР */
    .player-card{display:flex;flex-direction:column;align-items:center;gap:20px}

    /* ОБЛОЖКА — НЕТ will-change:transform чтобы не создавать stacking context */
    .cover-wrap{width:100%;max-width:280px;aspect-ratio:1;border-radius:22px;overflow:hidden;position:relative;cursor:grab;touch-action:pan-y;box-shadow:0 12px 50px rgba(0,0,0,.6);transition:box-shadow var(--med) var(--ease)}
    .cover-wrap.playing{animation:coverPulse 4s ease-in-out infinite alternate}
    @keyframes coverPulse{from{box-shadow:0 12px 50px rgba(176,60,255,.35)}to{box-shadow:0 20px 70px rgba(176,60,255,.65)}}
    .cover-wrap img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}

    .swipe-hint{position:absolute;inset:0;border-radius:22px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;background:rgba(9,8,15,.7);opacity:0;pointer-events:none;transition:opacity .25s}
    .swipe-hint.show{opacity:1}
    .sw-arr{font-size:2rem;color:var(--accent);filter:drop-shadow(0 0 8px var(--accent))}
    .sw-arr.l{animation:slideL .55s ease-in-out infinite alternate}
    .sw-arr.r{animation:slideR .55s ease-in-out infinite alternate}
    @keyframes slideL{to{transform:translateX(-10px)}}
    @keyframes slideR{to{transform:translateX(10px)}}

    .track-info{text-align:center;width:100%}
    .track-title{font-family:'Unbounded',sans-serif;font-size:clamp(1.05rem,4vw,1.45rem);font-weight:700;line-height:1.2;margin-bottom:6px;letter-spacing:-.3px}
    .track-author{font-size:.9rem;color:var(--muted)}

    /* СЛАЙДЕРЫ */
    .progress-row{display:flex;align-items:center;gap:12px;width:100%}
    .time-lbl{font-size:.78rem;color:var(--muted);min-width:34px;font-variant-numeric:tabular-nums}
    .time-lbl.r{text-align:right}
    input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;outline:none;width:100%}
    input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
    input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--glow);margin-top:-5.5px;transition:transform var(--fast) var(--ease)}
    input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:none}
    input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}
    #progress-bar{--pct:0%;background:linear-gradient(to right,var(--accent) var(--pct),rgba(255,255,255,.1) var(--pct));border-radius:3px}
    #volume-slider{--vpct:100%;background:linear-gradient(to right,rgba(255,255,255,.55) var(--vpct),rgba(255,255,255,.1) var(--vpct));border-radius:3px}

    /* КНОПКИ */
    .controls{display:flex;justify-content:center;align-items:center;gap:14px;width:100%}
    .ctrl-btn{width:50px;height:50px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:1.05rem;cursor:pointer;display:grid;place-items:center;transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
    .ctrl-btn:hover{background:rgba(176,60,255,.15)}
    .ctrl-btn:active{transform:scale(.88)}
    .ctrl-btn.play{width:68px;height:68px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff;font-size:1.4rem;box-shadow:0 0 28px var(--glow)}
    .ctrl-btn.play:hover{box-shadow:0 0 42px var(--glow)}
    .ctrl-btn.play:active{transform:scale(.92)}
    .ctrl-btn.active i{color:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
    .volume-row{display:flex;align-items:center;gap:12px;width:100%}
    .vol-ic{font-size:.9rem;color:var(--muted)}

    /* ПЛЕЙЛИСТ */
    .pl-header{font-family:'Unbounded',sans-serif;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:16px}
    .author-label{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:600;color:var(--accent);letter-spacing:.8px;text-transform:uppercase;padding:12px 0 8px}
    .author-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}
    .pl-item{display:flex;align-items:center;gap:12px;padding:9px 10px 9px 0;border-radius:14px;cursor:pointer;transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
    .pl-item:hover{background:rgba(176,60,255,.08)}
    .pl-item:active{transform:scale(.98);background:rgba(176,60,255,.14)}
    .pl-item.playing{background:rgba(176,60,255,.12)}
    .pl-item.playing .pl-title{color:var(--accent);font-weight:600}
    .pl-num{min-width:28px;text-align:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
    .pl-thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.05)}
    .pl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .pl-meta{flex:1;min-width:0}
    .pl-title{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--fast)}
    .pl-dur{font-size:.75rem;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
    .lyr-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);font-size:.8rem;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:background var(--fast),color var(--fast)}
    .lyr-btn:hover{background:rgba(176,60,255,.2);color:var(--accent)}

    /* МОДАЛ */
    .modal-bg{position:fixed;inset:0;z-index:50000;background:rgba(9,8,15,.82);backdrop-filter:blur(16px);display:flex;justify-content:center;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity var(--med) var(--ease)}
    .modal-bg.show{opacity:1;pointer-events:all}
    .modal-card{width:100%;max-width:520px;max-height:80dvh;background:rgba(16,12,28,.98);border:1px solid var(--border);border-bottom:none;border-radius:28px 28px 0 0;padding:28px 24px 48px;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.25,1,.5,1)}
    .modal-bg.show .modal-card{transform:translateY(0)}
    .modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-title{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700}
    .modal-close{width:36px;height:36px;border-radius:10px;background:rgba(176,60,255,.2);border:none;color:var(--accent);cursor:pointer;display:grid;place-items:center;font-size:1rem;transition:background var(--fast)}
    .modal-close:hover{background:rgba(176,60,255,.35)}
    #lyrics-text{white-space:pre-wrap;line-height:1.85;font-size:.92rem;color:var(--muted)}

    /* ТОСТ */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;padding:10px 22px;border-radius:20px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:99998;white-space:nowrap;box-shadow:0 8px 32px rgba(176,60,255,.5)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ПК */
    @media(min-width:640px){
      .layout{grid-template-columns:1fr 1fr;padding:32px 24px 56px;gap:24px}
      .header{grid-column:1/-1}
      .cover-wrap{max-width:240px}
      .modal-card{border-radius:28px;margin-bottom:32px}
    }
    @media(min-width:900px){.cover-wrap{max-width:260px}}

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(176,60,255,.3);border-radius:3px}
  </style>
</head>
<body>

<!-- ДРОПДАУН — прямо в body, вне любого stacking context -->
<div id="langDd" role="listbox">
  <div class="lang-opt" data-lang="kk">🇰🇿 Қазақша</div>
  <div class="lang-opt active" data-lang="ru">🇷🇺 Русский</div>
  <div class="lang-opt" data-lang="en">🇺🇸 English</div>
  <div class="lang-opt" data-lang="fr">🇫🇷 Français</div>
  <div class="lang-opt" data-lang="zh">🇨🇳 简体中文</div>
</div>

<div class="layout">
  <header class="header">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-headphones-alt"></i></div>
      <span data-key="title">UMIT Player</span>
    </div>
    <button id="langBtn" aria-haspopup="listbox" aria-expanded="false">
      <span id="langLabel">Русский</span>
      <i class="fas fa-chevron-down chevron"></i>
    </button>
  </header>

  <div class="card player-card">
    <audio id="audio" preload="metadata"></audio>

    <div class="cover-wrap" id="coverWrap">
      <img id="coverImg" src="" alt="cover">
      <div class="swipe-hint" id="swipeHint">
        <i class="fas fa-chevron-left sw-arr l"></i>
        <i class="fas fa-chevron-right sw-arr r"></i>
      </div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle" data-key="selectTrack">Выберите трек</div>
      <div class="track-author" id="trackAuthor">UMIT Project</div>
    </div>

    <div class="progress-row">
      <span class="time-lbl" id="curTime">0:00</span>
      <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.01">
      <span class="time-lbl r" id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" title="Shuffle"><i class="fas fa-shuffle"></i></button>
      <button class="ctrl-btn" onclick="playPrev()"><i class="fas fa-backward-step"></i></button>
      <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
      <button class="ctrl-btn" onclick="playNext()"><i class="fas fa-forward-step"></i></button>
      <button class="ctrl-btn" id="favBtn" onclick="toggleFav()"><i class="far fa-heart"></i></button>
    </div>

    <div class="volume-row">
      <i class="fas fa-volume-off vol-ic"></i>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
      <i class="fas fa-volume-high vol-ic"></i>
    </div>
  </div>

  <div class="card">
    <div class="pl-header" data-key="songsList">Список песен</div>
    <div id="playlist"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-hdr">
      <div class="modal-title" id="modalTitle">Текст песни</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="lyrics-text">...</div>
  </div>
</div>

<script>
const I18N={
  ru:{title:"UMIT Плеер",selectTrack:"Выберите трек",songsList:"Список песен",lyricsFor:"Текст: ",s1:"Орта жүз",s2:"Жарылғап батыр",s3:"Тегімнің рухы",s4:"Қалжыр",s5:"Қалжыр 2",s6:"Wedding Fog",s7:"Wedding Fog 2",s8:"Along the Roads",s9:"Анашым",s10:"Көктем",s11:"Туған туыс бақытым",a1:"Қабыкенов Сағыныш",a2:"Рамазанов Төреғали",added:"Добавлено ♥",removed:"Удалено"},
  kk:{title:"UMIT Плеєрі",selectTrack:"Тректі таңдаңыз",songsList:"Өлеңдер тізімі",lyricsFor:"Ән мәтіні: ",s1:"Орта жүз",s2:"Жарылғап батыр",s3:"Тегімнің рухы",s4:"Қалжыр",s5:"Қалжыр 2",s6:"Wedding Fog",s7:"Wedding Fog 2",s8:"Along the Roads",s9:"Анашым",s10:"Көктем",s11:"Туған туыс бақытым",a1:"Қабыкенов Сағыныш",a2:"Рамазанов Төреғали",added:"Қосылды ♥",removed:"Жойылды"},
  en:{title:"UMIT Player",selectTrack:"Select a track",songsList:"Songs list",lyricsFor:"Lyrics: ",s1:"Middle Zhuz",s2:"Zharylghap Batyr",s3:"Spirit of My Lineage",s4:"Kalzhyr",s5:"Kalzhyr 2",s6:"Wedding Fog",s7:"Wedding Fog 2",s8:"Along the Roads",s9:"Anashym",s10:"Spring",s11:"My Native Happiness",a1:"Kabikenov Sagynysh",a2:"Ramazanov Toreghali",added:"Added ♥",removed:"Removed"},
  fr:{title:"UMIT Lecteur",selectTrack:"Choisissez une piste",songsList:"Liste des chansons",lyricsFor:"Paroles : ",s1:"Juz du Milieu",s2:"Zharylghap Batyr",s3:"Esprit de ma lignée",s4:"Kalzhyr",s5:"Kalzhyr 2",s6:"Wedding Fog",s7:"Wedding Fog 2",s8:"Along the Roads",s9:"Anashym",s10:"Printemps",s11:"Mon bonheur natal",a1:"Kabikenov Sagynysh",a2:"Ramazanov Toreghali",added:"Ajouté ♥",removed:"Supprimé"},
  zh:{title:"UMIT 播放器",selectTrack:"选择曲目",songsList:"歌曲列表",lyricsFor:"歌词：",s1:"中玉兹",s2:"扎里尔哈普·巴蒂尔",s3:"我的血统精神",s4:"卡尔日尔",s5:"卡尔日尔2",s6:"婚礼雾",s7:"婚礼雾2",s8:"沿途",s9:"阿纳希姆",s10:"春天",s11:"我的原生幸福",a1:"卡比肯诺夫·萨格尼什",a2:"拉马扎诺夫·托雷加利",added:"已添加 ♥",removed:"已删除"},
};
const LANG_NAMES={kk:"Қазақша",ru:"Русский",en:"English",fr:"Français",zh:"简体中文"};
const TRACKS=[
  {tk:"s1",src:"orta_juz_audio.mp3",cover:"orta_juz.jpg",author:"a1",lyrics:"Орта жүз — мәтін..."},
  {tk:"s2",src:"jarylgap_batyr_audio.mp3",cover:"jarylgap_batyr.jpg",author:"a1",lyrics:"Жарылғап батыр — мәтін..."},
  {tk:"s3",src:"tegimnin_ruhy_audio.mp3",cover:"tegimnin_ruhy.jpg",author:"a1",lyrics:"Тегімнің рухы — мәтін..."},
  {tk:"s4",src:"Kalzhyr.mp3",cover:"Kalzhyr.jpg",author:"a1",lyrics:"Қалжыр — мәтін..."},
  {tk:"s5",src:"Kalzhyr2.mp3",cover:"Kalzhyr2.jpg",author:"a1",lyrics:"Қалжыр 2 — мәтін..."},
  {tk:"s6",src:"Wedding_fog.mp3",cover:"Wedding_fog.jpg",author:"a1",lyrics:"Wedding Fog lyrics..."},
  {tk:"s7",src:"Wedding_fog2.mp3",cover:"Wedding_fog2.jpg",author:"a1",lyrics:"Wedding Fog 2 lyrics..."},
  {tk:"s8",src:"Along_the_roads.mp3",cover:"Along_the_roads.jpg",author:"a1",lyrics:"Along the roads lyrics..."},
  {tk:"s9",src:"Anashym.mp3",cover:"Anashym.jpg",author:"a1",lyrics:"Анашым, анашым, сен менің анашым..."},
  {tk:"s10",src:"Koktem_audio.mp3",cover:"Koktem.jpg",author:"a2",lyrics:"Көктем — мәтін..."},
  {tk:"s11",src:"Tuğan_tūyıs_baqytym.mp3",cover:"Tūğan_tūyıs_baqytym.jpg",author:"a2",lyrics:"Туған туыс бақытым — мәтін..."},
];

let lang=localStorage.getItem('umit_lang')||'ru', curIdx=-1, shuffle=false;
let favs=JSON.parse(localStorage.getItem('umit_favs')||'[]'), durations={};

const T=()=>I18N[lang];
const fmt=s=>isNaN(s)||s<0?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

function showToast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2000)}

/* ЯЗЫК */
function applyLang(){
  document.querySelectorAll('[data-key]').forEach(el=>{if(T()[el.dataset.key])el.textContent=T()[el.dataset.key]});
  document.getElementById('langLabel').textContent=LANG_NAMES[lang];
  document.querySelectorAll('.lang-opt').forEach(o=>o.classList.toggle('active',o.dataset.lang===lang));
  buildPlaylist();
  if(curIdx>=0){document.getElementById('trackTitle').textContent=T()[TRACKS[curIdx].tk];document.getElementById('trackAuthor').textContent=T()[TRACKS[curIdx].author]}
}

/* ДРОПДАУН */
const langBtn=document.getElementById('langBtn'), langDd=document.getElementById('langDd');

function posDd(){
  const r=langBtn.getBoundingClientRect();
  langDd.style.top=(r.bottom+8)+'px';
  langDd.style.right=(document.documentElement.clientWidth-r.right)+'px';
  langDd.style.left='auto';
}
function openDd(){posDd();langDd.classList.add('open');langBtn.classList.add('open');langBtn.setAttribute('aria-expanded','true')}
function closeDd(){langDd.classList.remove('open');langBtn.classList.remove('open');langBtn.setAttribute('aria-expanded','false')}

langBtn.addEventListener('click',e=>{e.stopPropagation();langDd.classList.contains('open')?closeDd():openDd()});
document.addEventListener('click',e=>{if(!langDd.contains(e.target)&&e.target!==langBtn)closeDd()});
window.addEventListener('resize',()=>{if(langDd.classList.contains('open'))posDd()});
window.addEventListener('scroll',()=>{if(langDd.classList.contains('open'))posDd()},{passive:true});
langDd.querySelectorAll('.lang-opt').forEach(o=>o.addEventListener('click',e=>{e.stopPropagation();lang=o.dataset.lang;localStorage.setItem('umit_lang',lang);applyLang();closeDd()}));

/* ПЛЕЙЛИСТ */
function buildPlaylist(){
  const cont=document.getElementById('playlist'); cont.innerHTML=''; let lastA=null;
  TRACKS.forEach((tr,i)=>{
    if(tr.author!==lastA){const l=document.createElement('div');l.className='author-label';l.textContent=T()[tr.author];cont.appendChild(l);lastA=tr.author}
    const item=document.createElement('div');
    item.className='pl-item'+(i===curIdx?' playing':'');
    item.innerHTML=`<span class="pl-num">${i+1}</span><div class="pl-thumb"><img src="${tr.cover}" alt="" loading="lazy"></div><div class="pl-meta"><div class="pl-title">${T()[tr.tk]}</div></div><span class="pl-dur" id="dur-${i}">${durations[i]!=null?fmt(durations[i]):'—:——'}</span><button class="lyr-btn" data-i="${i}"><i class="fas fa-file-lines"></i></button>`;
    item.addEventListener('click',e=>{if(!e.target.closest('.lyr-btn'))loadTrack(i)});
    item.querySelector('.lyr-btn').addEventListener('click',e=>{e.stopPropagation();openModal(i)});
    cont.appendChild(item);
  });
}

/* АУДИО */
const audio=document.getElementById('audio'), playIcon=document.getElementById('playIcon');
const coverImg=document.getElementById('coverImg'), coverWrap=document.getElementById('coverWrap');
const prog=document.getElementById('progress-bar'), volSlider=document.getElementById('volume-slider');
const curTimeEl=document.getElementById('curTime'), durTimeEl=document.getElementById('durTime');

function setPlaying(on){playIcon.className=on?'fas fa-pause':'fas fa-play';coverWrap.classList.toggle('playing',on)}

function loadTrack(idx){
  if(idx===curIdx){togglePlay();return}
  curIdx=idx; const tr=TRACKS[idx];
  audio.src=tr.src; coverImg.src=tr.cover;
  document.getElementById('trackTitle').textContent=T()[tr.tk];
  document.getElementById('trackAuthor').textContent=T()[tr.author];
  prog.value=0; prog.style.setProperty('--pct','0%');
  curTimeEl.textContent='0:00'; durTimeEl.textContent=durations[idx]!=null?fmt(durations[idx]):'0:00';
  audio.load(); audio.play().catch(()=>{}); setPlaying(true); buildPlaylist(); updateFavBtn();
}

function togglePlay(){if(curIdx<0){loadTrack(0);return}if(audio.paused){audio.play();setPlaying(true)}else{audio.pause();setPlaying(false)}}

function playNext(){
  let n=shuffle?(()=>{let x;do{x=Math.floor(Math.random()*TRACKS.length)}while(x===curIdx&&TRACKS.length>1);return x})():(curIdx<0?0:(curIdx+1)%TRACKS.length);
  loadTrack(n);
}
function playPrev(){if(curIdx<0){loadTrack(TRACKS.length-1);return}if(audio.currentTime>3){audio.currentTime=0;return}loadTrack((curIdx-1+TRACKS.length)%TRACKS.length)}

audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;const p=(audio.currentTime/audio.duration)*100;prog.value=p;prog.style.setProperty('--pct',p.toFixed(2)+'%');curTimeEl.textContent=fmt(audio.currentTime)});
audio.addEventListener('loadedmetadata',()=>{durTimeEl.textContent=fmt(audio.duration);if(curIdx>=0&&audio.duration){durations[curIdx]=audio.duration;const e=document.getElementById('dur-'+curIdx);if(e)e.textContent=fmt(audio.duration)}});
audio.addEventListener('ended',playNext);
prog.addEventListener('input',()=>{if(audio.duration){audio.currentTime=(prog.value/100)*audio.duration;prog.style.setProperty('--pct',prog.value+'%')}});
volSlider.addEventListener('input',()=>{audio.volume=volSlider.value;volSlider.style.setProperty('--vpct',(volSlider.value*100).toFixed(1)+'%')});

TRACKS.forEach((tr,i)=>{const a=new Audio();a.preload='metadata';a.src=tr.src;a.addEventListener('loadedmetadata',()=>{durations[i]=a.duration;const e=document.getElementById('dur-'+i);if(e)e.textContent=fmt(a.duration)},{once:true})});

document.getElementById('shuffleBtn').addEventListener('click',function(){shuffle=!shuffle;this.classList.toggle('active',shuffle)});

function toggleFav(){if(curIdx<0)return;const i=favs.indexOf(curIdx);if(i<0){favs.push(curIdx);showToast(T().added)}else{favs.splice(i,1);showToast(T().removed)}localStorage.setItem('umit_favs',JSON.stringify(favs));updateFavBtn()}
function updateFavBtn(){const btn=document.getElementById('favBtn'),liked=favs.includes(curIdx);btn.querySelector('i').className=liked?'fas fa-heart':'far fa-heart';btn.classList.toggle('active',liked)}

/* ЖЕСТЫ */
(function(){
  const wrap=document.getElementById('coverWrap'),hint=document.getElementById('swipeHint');
  let sx=0,sy=0,dragging=false,lastTap=0;
  function onStart(e){const pt=e.touches?e.touches[0]:e;sx=pt.clientX;sy=pt.clientY;dragging=true;const now=Date.now();if(now-lastTap<280)togglePlay();lastTap=now;hint.classList.add('show')}
  function onMove(e){if(!dragging)return;const pt=e.touches?e.touches[0]:e,dx=pt.clientX-sx,dy=Math.abs(pt.clientY-sy);if(Math.abs(dx)>dy)wrap.style.transform=`translateX(${dx*.3}px)`}
  function onEnd(e){if(!dragging)return;dragging=false;hint.classList.remove('show');wrap.style.transition='transform .25s cubic-bezier(.4,0,.2,1)';wrap.style.transform='';setTimeout(()=>wrap.style.transition='',260);const pt=e.changedTouches?e.changedTouches[0]:e,dx=pt.clientX-sx,dy=Math.abs(pt.clientY-sy);if(Math.abs(dx)>55&&Math.abs(dx)>dy)dx>0?playPrev():playNext()}
  wrap.addEventListener('touchstart',onStart,{passive:true});
  wrap.addEventListener('touchmove',onMove,{passive:true});
  wrap.addEventListener('touchend',onEnd,{passive:true});
  wrap.addEventListener('mousedown',onStart);
  wrap.addEventListener('mousemove',e=>{if(e.buttons)onMove(e)});
  wrap.addEventListener('mouseup',onEnd);
})();

function openModal(idx){const tr=TRACKS[idx];document.getElementById('modalTitle').textContent=T().lyricsFor+T()[tr.tk];document.getElementById('lyrics-text').textContent=tr.lyrics||'—';document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.code==='ArrowRight')playNext();if(e.code==='ArrowLeft')playPrev()});

applyLang();
audio.volume=1;
volSlider.style.setProperty('--vpct','100%');
</script>
</body>
</html>
