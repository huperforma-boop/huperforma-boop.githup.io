<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMIT | Neon Purple Player</title>

    <!-- Шрифты / иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ---------- ПЕРЕМЕННЫЕ ---------- */
        :root {
            --glass-bg: rgba(26, 26, 36, 0.45);
            --glass-border: rgba(196, 69, 255, 0.25);
            --primary-color: #ffffff;
            --accent-color: #c445ff;          /* неон-фиолетовый */
            --background: #0f0c1d;
            --text-color: #ffffff;
            --secondary-text: #c9c9d0;
            --transition-speed: 0.35s;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--background);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            background: radial-gradient(circle at top, #1c102e 0%, #0f0c1d 100%);
            overflow-x: hidden;
        }
        .mobile-container {
            width: 100%;
            max-width: 420px;
            margin-top: 20px;
        }
        .glass-card {
            background: var(--glass-bg);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 8px 32px rgba(196, 69, 255, 0.18);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(196, 69, 255, 0.28);
        }
        /* хедер */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--accent-color);
        }
        .logo-title i {
            color: var(--accent-color);
            font-size: 1.9rem;
            filter: drop-shadow(0 0 6px var(--accent-color));
        }
        /* языковой переключатель */
        .language-switcher {
            position: relative;
        }
        #lang-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background var(--transition-speed), transform var(--transition-speed);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        #lang-btn:active {
            transform: scale(0.95);
        }
        .lang-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            z-index: 10;
            padding: 10px;
            min-width: 150px;
            display: none; /* изначально скрыт */
        }
        .lang-option {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .lang-option:hover {
            background: rgba(196, 69, 255, 0.15);
        }
        .lang-option.active {
            background: rgba(196, 69, 255, 0.25);
            color: var(--accent-color);
            font-weight: 600;
        }
        /* плеер */
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }
        .cover-art {
            width: 100%;
            max-width: 300px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(196, 69, 255, 0.25);
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .cover-art.playing {
            animation: pulse-cover 3s infinite alternate;
        }
        @keyframes pulse-cover {
            0%   { transform: scale(1);   box-shadow: 0 0 40px rgba(196, 69, 255, 0.3); }
            100% { transform: scale(1.03); box-shadow: 0 0 70px rgba(196, 69, 255, 0.6); }
        }
        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed) ease;
            pointer-events: none;
        }
        .gesture-indicator {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 12, 29, 0.75);
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .gesture-indicator.show {
            opacity: 1;
        }
        .gesture-arrow {
            font-size: 2.6rem;
            margin: 0 16px;
            color: var(--accent-color);
            filter: drop-shadow(0 0 6px var(--accent-color));
            animation: bounce 0.55s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateX(0); }
            to   { transform: translateX(12px); }
        }
        .track-info {
            text-align: center;
            width: 100%;
            transition: opacity var(--transition-speed) ease;
        }
        #current-track-title {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        #current-track-author {
            font-size: 1.05rem;
            color: var(--secondary-text);
        }
        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 12px;
            margin-top: 12px;
        }
        .time-display {
            font-size: 0.9rem;
            color: var(--secondary-text);
            min-width: 38px;
        }
        #progress-bar {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: background var(--transition-speed) ease;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
            transition: transform 0.15s ease;
        }
        #progress-bar::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }
        .main-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 300px;
            margin-top: 18px;
        }
        .control-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: grid;
            place-items: center;
        }
        .control-btn:active {
            transform: scale(0.85);
            box-shadow: inset 0 0 12px rgba(196, 69, 255, 0.4);
        }
        .control-btn:hover {
            background: rgba(196, 69, 255, 0.15);
        }
        .control-btn.play-pause {
            width: 76px;
            height: 76px;
            background: var(--accent-color);
            color: var(--background);
            border: none;
            font-size: 1.6rem;
            box-shadow: 0 0 24px rgba(196, 69, 255, 0.55);
        }
        .control-btn.play-pause:active {
            transform: scale(0.9);
            box-shadow: 0 0 32px rgba(196, 69, 255, 0.75);
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 0;
            margin-top: 6px;
        }
        #volume-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            transition: transform 0.15s ease;
        }
        #volume-slider::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }
        #main-favorite-btn {
            margin-top: 14px;
            transition: color var(--transition-speed) ease, text-shadow var(--transition-speed) ease;
        }
        #main-favorite-btn.active i {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(196, 69, 255, 0.15);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .playlist-item:last-child {
            border-bottom: none;
        }
        .playlist-item:active {
            background: rgba(196, 69, 255, 0.1);
            transform: scale(0.98);
        }
        .playlist-item.playing .item-title {
            color: var(--accent-color);
            font-weight: 600;
            text-shadow: 0 0 8px var(--accent-color);
        }
        .item-details {
            flex: 1;
            padding: 0 16px;
            min-width: 0;
        }
        .item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color var(--transition-speed) ease;
        }
        .lyrics-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 12, 29, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .lyrics-modal.show {
            display: flex;
            opacity: 1;
        }
        .lyrics-content-card {
            width: 100%;
            max-width: 500px;
            height: 80%;
            background: var(--glass-bg);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 32px 24px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .lyrics-modal.show .lyrics-content-card {
            transform: translateY(0);
        }
        .lyrics-close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .lyrics-close-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- ХЕДЕР -->
        <div class="header">
            <div class="logo-title">
                <i class="fas fa-headphones-alt"></i>
                <h1 data-lang-key="title">UMIT Плеер</h1>
            </div>

            <div class="language-switcher">
                <button id="lang-btn">
                    <span id="current-lang-text">Русский</span>
                    <i class="fas fa-chevron-down"></i>
                </button>

                <div class="glass-card lang-dropdown" id="lang-dropdown">
                    <div class="lang-option" onclick="switchLanguage('kk', event)">🇰🇿 Қазақша</div>
                    <div class="lang-option active" onclick="switchLanguage('ru', event)">🇷🇺 Русский</div>
                    <div class="lang-option" onclick="switchLanguage('en', event)">🇺🇸 English</div>
                    <div class="lang-option" onclick="switchLanguage('fr', event)">🇫🇷 Français</div>
                    <div class="lang-option" onclick="switchLanguage('zh', event)">🇨🇳 简体中文</div>
                </div>
            </div>
        </div>

        <!-- ПЛЕЕР -->
        <div class="glass-card player-card">
            <audio id="global-audio-player" src="" preload="metadata"></audio>

            <div class="cover-art" id="cover-art-container">
                <div class="gesture-indicator" id="gesture-indicator">
                    <i class="fas fa-arrow-left gesture-arrow"></i>
                    <i class="fas fa-arrow-right gesture-arrow"></i>
                </div>
                <img id="track-cover" src="" alt="Track Cover">
            </div>

            <div class="track-info">
                <h2 id="current-track-title" data-lang-key="selectTrack">Выберите трек</h2>
                <p id="current-track-author">UMIT Project</p>
            </div>

            <div class="progress-container">
                <span id="current-time" class="time-display">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <span id="duration" class="time-display">0:00</span>
            </div>

            <div class="main-controls">
                <button class="control-btn" onclick="playPrevious()">
                    <i class="fas fa-backward"></i>
                </button>
                <button class="control-btn play-pause" id="main-play-btn" onclick="togglePlay()">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" onclick="playNext()">
                    <i class="fas fa-forward"></i>
                </button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                <i class="fas fa-volume-up"></i>
            </div>

            <button class="control-btn" id="main-favorite-btn" onclick="toggleFavorite()" style="margin-top: 12px;">
                <i class="far fa-heart"></i>
            </button>
        </div>

        <!-- ПЛЕЙЛИСТ -->
        <div class="glass-card">
            <h3 class="playlist-header" data-lang-key="songsList">Список песен</h3>
            <div id="main-playlist-items" class="playlist-items"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ТЕКСТА -->
    <div class="lyrics-modal" id="lyrics-modal" onclick="closeLyricsModal()">
        <div class="lyrics-content-card" onclick="event.stopPropagation()">
            <button class="lyrics-close-btn" onclick="closeLyricsModal()">
                <i class="fas fa-times"></i>
            </button>
            <h3 id="lyrics-title">Текст песни</h3>
            <p id="lyrics-text">Текст загружается...</p>
        </div>
    </div>

    <script>
        /* ===================================================
           ДАННЫЕ / ЯЗЫКИ
        =================================================== */
        let currentLanguage = localStorage.getItem('language') || 'ru';
        let currentTrackIndex = -1;
        let favorites = JSON.parse(localStorage.getItem('audioPlayerFavorites')) || [];

        const translations = {
            ru: {
                title: "UMIT Плеер",
                selectTrack: "Выберите трек",
                lyrics: "Текст песни",
                songsList: "Список песен",
                song1: "Орта жүз", song2: "Жарылғап батыр", song3: "Тегімнің рухы",
                song4: "Қалжыр", song5: "Қалжыр2", song6: "Wedding_fog",
                song7: "Wedding_fog2", song8: "Along_the_roads", song9: "Көктем",
                song10: "Туған туыс бақытым", song11: "Анашым",
                added: "Добавлено!", removed: "Удалено!",
                lyricsTitle: "Текст песни: ",
                author1: "Қабыкенов Сағыныш", author2: "Рамазанов Төреғали"
            },
            kk: {
                title: "UMIT Плеєрі", selectTrack: "Тректі таңдаңыз", lyrics: "Мәтін",
                songsList: "Өлеңдер Тізімі:", song1: "Орта жүз", song2: "Жарылғап батыр",
                song3: "Тегімнің рухы", song4: "Қалжыр", song5: "Қалжыр2",
                song6: "Wedding_fog", song7: "Wedding_fog2", song8: "Along_the_roads",
                song9: "Көктем", song10: "Туған туыс бақытым", song11: "Анашым",
                added: "Қосылды!", removed: "Жойылды!",
                lyricsTitle: "Ән мәтіні: ", author1: "Қабыкенов Сағыныш", author2: "Рамазанов Төреғали"
            },
            en: {
                title: "UMIT Player", selectTrack: "Select a track", lyrics: "Lyrics",
                songsList: "Songs List:", song1: "Middle Zhuz", song2: "Zharylghap Batyr",
                song3: "Spirit of My Lineage", song4: "Kalzhyr", song5: "Kalzhyr2",
                song6: "Wedding_fog", song7: "Wedding_fog2", song8: "Along_the_roads",
                song9: "Spring", song10: "My Native Happiness", song11: "Anashym",
                added: "Added!", removed: "Removed!",
                lyricsTitle: "Lyrics for: ", author1: "Kabikenov Sagynysh", author2: "Ramazanov Toreghali"
            },
            fr: {
                title: "UMIT Lecteur", selectTrack: "Sélectionnez une piste", lyrics: "Paroles",
                songsList: "Liste des Chansons:", song1: "Juz du Milieu", song2: "Zharylghap Batyr",
                song3: "Esprit de Ma Lignée", song4: "Kalzhyr", song5: "Kalzhyr2",
                song6: "Wedding_fog", song7: "Wedding_fog2", song8: "Along_the_roads",
                song9: "Printemps", song10: "Mon Bonheur Natal", song11: "Anashym",
                added: "Ajouté!", removed: "Supprimé!",
                lyricsTitle: "Paroles de: ", author1: "Kabikenov Sagynysh", author2: "Ramazanov Toreghali"
            },
            zh: {
                title: "UMIT 播放器", selectTrack: "选择曲目", lyrics: "歌词",
                songsList: "歌曲列表:", song1: "中玉兹", song2: "扎里尔哈普·巴蒂尔",
                song3: "我的血统精神", song4: "卡尔日尔", song5: "卡尔日尔2",
                song6: "Wedding_fog", song7: "Wedding_fog2", song8: "Along_the_roads",
                song9: "春天", song10: "我的原生幸福", song11: "阿纳希姆",
                added: "已添加!", removed: "已删除!",
                lyricsTitle: "歌词: ", author1: "Кабыкенов Сагыныш", author2: "拉马扎诺夫·托雷加利"
            }
        };

        const tracks = [
            { titleKey: "song1", src: "orta_juz_audio.mp3", cover: "orta_juz.jpg", id: 0, author: "author1", lyrics: "Текст песни 1 (Орта жүз) \n\n" },
            { titleKey: "song2", src: "jarylgap_batyr_audio.mp3", cover: "jarylgap_batyr.jpg", id: 1, author: "author1", lyrics: "Текст песни 2 (Жарылғап батыр) \n\n" },
            { titleKey: "song3", src: "tegimnin_ruhy_audio.mp3", cover: "tegimnin_ruhy.jpg", id: 2, author: "author1", lyrics: "Текст песни 3 (Тегімнің рухы) \n\n" },
            { titleKey: "song4", src: "Kalzhyr.mp3", cover: "Kalzhyr.jpg", id: 3, author: "author1", lyrics: "Текст песни 4 (Қалжыр) \n\n" },
            { titleKey: "song5", src: "Kalzhyr2.mp3", cover: "Kalzhyr2.jpg", id: 4, author: "author1", lyrics: "Текст песни 5 (Қалжыр2) \n\n" },
            { titleKey: "song6", src: "Wedding_fog.mp3", cover: "Wedding_fog.jpg", id: 5, author: "author1", lyrics: "Текст песни 6 (Wedding_fog) \n\n" },
            { titleKey: "song7", src: "Wedding_fog2.mp3", cover: "Wedding_fog2.jpg", id: 6, author: "author1", lyrics: "Текст песни 7 (Wedding_fog2) \n\n" },
            { titleKey: "song8", src: "Along_the_roads.mp3", cover: "Along_the_roads.jpg", id: 7, author: "author1", lyrics: "Текст песни 8 (Along_the_roads) \n\n" },
            { titleKey: "song11", src: "Anashym.mp3", cover: "Anashym.jpg", id: 8, author: "author1", lyrics: "Анашым, анашым, сен менің анашым...\n\n[полный текст]" },
            { titleKey: "song9", src: "Koktem_audio.mp3", cover: "Koktem.jpg", id: 9, author: "author2", lyrics: "Текст песни 9 (Көктем) \n\n" },
            { titleKey: "song10", src: "Tuğan_tūyıs_baqytym.mp3", cover: "Tūğan_tūyıs_baqytym.jpg", id: 10, author: "author2", lyrics: "Текст песни 10 (Туған туыс бақытым) \n\n" }
        ];

        /* ===================================================
           УТИЛИТЫ
        =================================================== */
        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        /* ===================================================
           ЯЗЫК
        =================================================== */
        function switchLanguage(lang, e) {
            if (e) e.stopPropagation();
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            document.querySelectorAll('.lang-dropdown .lang-option').forEach(opt => opt.classList.remove('active'));
            if (e && e.target.classList.contains('lang-option')) e.target.classList.add('active');

            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.getAttribute('data-lang-key');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            const langNameMap = { kk: 'Қазақша', ru: 'Русский', en: 'English', fr: 'Français', zh: '简体中文' };
            document.getElementById('current-lang-text').textContent = langNameMap[lang] || 'Language';

            updateTrackList();
            if (currentTrackIndex !== -1) {
                const t = tracks[currentTrackIndex];
                document.getElementById('current-track-title').textContent = translations[lang][t.titleKey];
                document.getElementById('current-track-author').textContent = translations[lang][t.author];
            } else {
                document.getElementById('current-track-title').textContent = translations[lang].selectTrack;
                document.getElementById('current-track-author').textContent = "UMIT Project";
            }
            closeLangDropdown();
        }
        function toggleLangDropdown(e) {
            if (e) e.stopPropagation();
            const d = document.getElementById('lang-dropdown');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }
        function closeLangDropdown() {
            document.getElementById('lang-dropdown').style.display = 'none';
        }
        /* клик вне дропдауна – закрыть */
        document.addEventListener('click', e => {
            const d = document.getElementById('lang-dropdown');
            const b = document.getElementById('lang-btn');
            if (d && d.style.display === 'block' && !d.contains(e.target) && (!b || !b.contains(e.target))) closeLangDropdown();
        });
        /* клик по самой кнопке (стрелка) – не закрывать сразу */
        document.getElementById('lang-btn').addEventListener('click', e => {
            e.stopPropagation();
            toggleLangDropdown();
        });

        /* ===================================================
           ПЛЕЙЛИСТ
        =================================================== */
        function updateTrackList() {
            const cont = document.getElementById('main-playlist-items');
            cont.innerHTML = '';
            let curAuth = null;
            tracks.forEach((tr, idx) => {
                if (tr.author !== curAuth) {
                    const h = document.createElement('h4');
                    h.className = 'playlist-author-header';
                    h.textContent = translations[currentLanguage][tr.author];
                    cont.appendChild(h);
                    curAuth = tr.author;
                }
                const div = document.createElement('div');
                div.className = 'playlist-item' + (idx === currentTrackIndex ? ' playing' : '');
                div.innerHTML = `
                    <div class="item-index">${idx + 1}</div>
                    <div class="item-details" onclick="loadTrack(${idx})">
                        <div class="item-title">${translations[currentLanguage][tr.titleKey]}</div>
                    </div>
                    <div class="item-duration">${idx % 3 === 0 ? "3:49" : idx % 3 === 1 ? "2:34" : "2:16"}</div>
                    <button class="control-btn" style="width:40px;height:40px;margin-left:10px;" onclick="openLyricsModal(${idx},event)">
                        <i class="fas fa-file-lines"></i>
                    </button>
                `;
                cont.appendChild(div);
            });
        }

        /* ===================================================
           АУДИО-ПЛЕЕР
        =================================================== */
        const audio = document.getElementById('global-audio-player');
        const playBtn = document.getElementById('main-play-btn');
        const playIcon = playBtn.querySelector('i');
        const cover = document.getElementById('cover-art-container');
        const coverImg = document.getElementById('track-cover');
        const titleEl = document.getElementById('current-track-title');
        const authorEl = document.getElementById('current-track-author');
        const prog = document.getElementById('progress-bar');
        const curTime = document.getElementById('current-time');
        const dur = document.getElementById('duration');
        const vol = document.getElementById('volume-slider');
        const favBtn = document.getElementById('main-favorite-btn');

        function updatePlayButton(playing) {
            playIcon.className = playing ? 'fas fa-pause' : 'fas fa-play';
            cover.classList.toggle('playing', playing);
        }
        function loadTrack(idx) {
            if (idx === currentTrackIndex) { togglePlay(); return; }
            currentTrackIndex = idx;
            const t = tracks[idx];
            audio.src = t.src;
            titleEl.textContent = translations[currentLanguage][t.titleKey];
            authorEl.textContent = translations[currentLanguage][t.author];
            coverImg.src = t.cover;
            audio.load();
            audio.play();
            updatePlayButton(true);
            updateTrackList();
            updateFavoriteButton();
        }
        function togglePlay() {
            if (currentTrackIndex === -1) { loadTrack(0); return; }
            if (audio.paused) { audio.play(); updatePlayButton(true); }
            else { audio.pause(); updatePlayButton(false); }
        }
        function playNext() {
            if (currentTrackIndex === -1) { loadTrack(0); return; }
            let next = currentTrackIndex + 1; if (next >= tracks.length) next = 0;
            loadTrack(next);
        }
        function playPrevious() {
            if (currentTrackIndex === -1) { loadTrack(tracks.length - 1); return; }
            if (audio.currentTime < 3 && currentTrackIndex > 0) { let prev = currentTrackIndex - 1; loadTrack(prev); }
            else { audio.currentTime = 0; }
        }

        /* ===================================================
           ИЗБРАННОЕ
        =================================================== */
        function toggleFavorite() {
            if (currentTrackIndex === -1) return;
            const id = tracks[currentTrackIndex].id;
            const i = favorites.indexOf(id);
            if (i === -1) favorites.push(id); else favorites.splice(i, 1);
            localStorage.setItem('audioPlayerFavorites', JSON.stringify(favorites));
            updateFavoriteButton();
        }
        function updateFavoriteButton() {
            if (!favBtn) return;
            if (currentTrackIndex === -1) { favBtn.querySelector('i').className = 'far fa-heart'; favBtn.classList.remove('active'); return; }
            const id = tracks[currentTrackIndex].id;
            const liked = favorites.includes(id);
            favBtn.querySelector('i').className = liked ? 'fas fa-heart' : 'far fa-heart';
            favBtn.classList.toggle('active', liked);
        }

        /* ===================================================
           ЖЕСТЫ
        =================================================== */
        function initGestures() {
            const c = cover;
            let startX = 0, startY = 0, endX = 0, endY = 0, lastTap = 0;
            function handleStart(e) {
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                startX = x; startY = y;
                const now = new Date().getTime();
                const tapLen = now - lastTap;
                if (tapLen < 300 && tapLen > 0) { togglePlay(); c.style.transform = 'scale(0.95)'; setTimeout(() => c.style.transform = 'scale(1)', 150); }
                lastTap = now;
            }
            function handleEnd(e) {
                endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                endY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                const dx = endX - startX, dy = endY - startY;
                c.style.transform = 'translateX(0)';
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    if (dx > 0) playPrevious(); else playNext();
                }
                startX = 0; startY = 0;
            }
            c.addEventListener('touchstart', handleStart, { passive: true });
            c.addEventListener('touchend', handleEnd, { passive: false });
            c.addEventListener('mousedown', handleStart);
            c.addEventListener('mouseup', handleEnd);
        }

        /* ===================================================
           ТЕКСТ ПЕСНИ
        =================================================== */
        function openLyricsModal(idx, e) {
            if (e) e.stopPropagation();
            const modal = document.getElementById('lyrics-modal');
            const t = tracks[idx];
            document.getElementById('lyrics-title').textContent = translations[currentLanguage].lyricsTitle + translations[currentLanguage][t.titleKey];
            document.getElementById('lyrics-text').textContent = t.lyrics || "Текст не найден.";
            modal.classList.add('show');
        }
        function closeLyricsModal() {
            document.getElementById('lyrics-modal').classList.remove('show');
        }

        /* ===================================================
           СОБЫТИЯ АУДИО
        =================================================== */
        audio.addEventListener('timeupdate', () => {
            prog.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
            curTime.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
            dur.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('ended', playNext);
        prog.addEventListener('input', () => {
            audio.currentTime = (prog.value / 100) * audio.duration;
        });
        vol.addEventListener('input', () => audio.volume = vol.value);

        /* ===================================================
           СТАРТ
        =================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            switchLanguage(currentLanguage);
            audio.volume = vol.value;
            updateFavoriteButton();
            if (tracks.length) { loadTrack(0); audio.pause(); updatePlayButton(false); authorEl.textContent = "UMIT Project"; }
            initGestures();
        });
    </script>
</body>
</html>
