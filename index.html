<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMIT | Көңілдік Аудио Плеєр</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ===== СБРОС СТИЛЕЙ И ОСНОВНЫЕ НАСТРОЙКИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #f72585;
            --success-color: #4cc9f0;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --gradient: linear-gradient(135deg, #4361ee, #3a0ca3, #f72585);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius: 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ===== АНИМИРОВАННЫЙ ФОН ===== */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.1) 0%, transparent 70%);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, 50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ===== ШАПКА ===== */
        .header {
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 250px;
        }

        .control-btn {
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            flex: 1;
            justify-content: center;
        }

        .control-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .control-btn i {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        /* ===== ОСНОВНОЙ ПЛЕЕР ===== */
        .player-container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .player-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--gradient);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .player-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-header h2 i {
            color: var(--accent-color);
        }

        .player-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: var(--primary-color);
            transform: scale(1.1);
        }

        .action-btn.favorite.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* ===== ОБЛОЖКА И ИНФОРМАЦИЯ О ТРЕКЕ ===== */
        .player-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .player-content {
                flex-direction: row;
                align-items: center;
            }
        }

        .album-art {
            flex-shrink: 0;
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }

        .album-art-inner {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .album-art-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .album-art-inner.playing img {
            animation: rotateAlbum 20s linear infinite;
        }

        @keyframes rotateAlbum {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .album-placeholder {
            width: 100%;
            height: 100%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-placeholder i {
            font-size: 4rem;
            color: white;
            opacity: 0.8;
        }

        .track-info {
            flex: 1;
            text-align: center;
        }

        @media (min-width: 768px) {
            .track-info {
                text-align: left;
                padding-left: 40px;
            }
        }

        .track-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .track-artist {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .track-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .track-meta {
                justify-content: flex-start;
            }
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .meta-item i {
            color: var(--primary-color);
        }

        /* ===== ЭЛЕМЕНТЫ УПРАВЛЕНИЯ ПЛЕЕРОМ ===== */
        .player-controls {
            margin-top: 30px;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 10px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-color);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-family: monospace;
            font-size: 0.9rem;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .player-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .player-btn:hover {
            background: var(--primary-color);
            transform: scale(1.1);
        }

        .player-btn.play-pause {
            width: 70px;
            height: 70px;
            background: var(--gradient);
            border: none;
            box-shadow: 0 10px 30px rgba(67, 97, 238, 0.3);
        }

        .player-btn.play-pause:hover {
            transform: scale(1.15);
            box-shadow: 0 15px 40px rgba(67, 97, 238, 0.4);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* ===== ПАНЕЛЬ ФИЛЬТРОВ ===== */
        .filter-panel {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .filter-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .search-box {
            position: relative;
            margin-top: 20px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* ===== СПИСОК ТРЕКОВ ===== */
        .playlist-container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .playlist-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .track-count {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(67, 97, 238, 0.3);
            transform: translateX(5px);
        }

        .track-item.playing {
            background: rgba(67, 97, 238, 0.15);
            border-color: var(--primary-color);
        }

        .track-number {
            width: 30px;
            height: 30px;
            background: rgba(67, 97, 238, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary-color);
            flex-shrink: 0;
        }

        .track-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .track-details {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-weight: 500;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-author {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .track-duration {
            color: var(--text-secondary);
            font-family: monospace;
            flex-shrink: 0;
        }

        .track-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .track-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .track-action-btn:hover {
            background: var(--primary-color);
        }

        .track-action-btn.favorite.active {
            background: var(--accent-color);
        }

        /* ===== ТЕКСТЫ ПЕСЕН ===== */
        .lyrics-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .lyrics-modal.active {
            display: flex;
        }

        .lyrics-content {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lyrics-text {
            line-height: 1.8;
            white-space: pre-wrap;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .lyrics-author {
            text-align: right;
            margin-top: 20px;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* ===== УВЕДОМЛЕНИЯ ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gradient);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .notification.show {
            opacity: 1;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .player-container {
                padding: 20px;
            }
            
            .album-art {
                width: 200px;
                height: 200px;
            }
            
            .track-title {
                font-size: 1.8rem;
            }
            
            .filter-options {
                justify-content: center;
            }
            
            .track-item {
                flex-wrap: wrap;
            }
            
            .track-actions {
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 20px 10px;
            }
            
            .control-panel {
                flex-direction: column;
            }
            
            .control-group {
                width: 100%;
            }
            
            .album-art {
                width: 180px;
                height: 180px;
            }
            
            .player-btn {
                width: 45px;
                height: 45px;
            }
            
            .player-btn.play-pause {
                width: 60px;
                height: 60px;
            }
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: slideIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <!-- Анимированный фон -->
    <div class="animated-bg" id="animated-bg"></div>

    <!-- Основной контейнер -->
    <div class="container">
        <!-- Шапка -->
        <header class="header animate-in">
            <h1><i class="fas fa-music"></i> UMIT Аудио Плеєр</h1>
            <p>Қазақстандық авторлардың ең жақсы әндері бір жерде</p>
        </header>

        <!-- Панель управления -->
        <div class="control-panel animate-in">
            <div class="control-group">
                <button class="control-btn" onclick="toggleTheme()">
                    <i class="fas fa-palette"></i>
                    <span>Теманы өзгерту</span>
                </button>
                <button class="control-btn" onclick="toggleLanguage()">
                    <i class="fas fa-globe"></i>
                    <span>Тілді өзгерту</span>
                </button>
            </div>
            <div class="control-group">
                <button class="control-btn" onclick="showAllTracks()">
                    <i class="fas fa-list"></i>
                    <span>Барлық әндер</span>
                </button>
                <button class="control-btn" onclick="showFavorites()">
                    <i class="fas fa-heart"></i>
                    <span>Таңдаулылар</span>
                    <span class="favorites-count">(0)</span>
                </button>
            </div>
        </div>

        <!-- Основной плеер -->
        <div class="player-container animate-in">
            <div class="player-header">
                <h2><i class="fas fa-play-circle"></i> Қазір ойнауда</h2>
                <div class="player-actions">
                    <button class="action-btn favorite" onclick="toggleCurrentFavorite()">
                        <i class="far fa-heart"></i>
                    </button>
                    <button class="action-btn" onclick="shareTrack()">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>

            <div class="player-content">
                <!-- Обложка альбома -->
                <div class="album-art">
                    <div class="album-art-inner" id="album-art">
                        <div class="album-placeholder">
                            <i class="fas fa-music"></i>
                        </div>
                        <img id="cover-image" src="" alt="Альбом обложкасы" style="display: none;">
                    </div>
                </div>

                <!-- Информация о треке -->
                <div class="track-info">
                    <h3 class="track-title" id="current-track-title">Ән таңдаңыз</h3>
                    <p class="track-artist" id="current-track-artist">-</p>
                    
                    <div class="track-meta">
                        <div class="meta-item">
                            <i class="fas fa-user"></i>
                            <span id="current-track-author">Автор</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-clock"></i>
                            <span id="current-track-duration">0:00</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-calendar"></i>
                            <span>2024</span>
                        </div>
                    </div>

                    <!-- Аудио элемент -->
                    <audio id="audio-player" src=""></audio>

                    <!-- Элементы управления плеером -->
                    <div class="player-controls">
                        <!-- Прогресс бар -->
                        <div class="progress-container">
                            <div class="progress-bar" id="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                            <div class="time-display">
                                <span id="current-time">0:00</span>
                                <span id="total-time">0:00</span>
                            </div>
                        </div>

                        <!-- Кнопки управления -->
                        <div class="control-buttons">
                            <button class="player-btn" onclick="previousTrack()">
                                <i class="fas fa-step-backward"></i>
                            </button>
                            <button class="player-btn play-pause" onclick="togglePlay()" id="play-btn">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="player-btn" onclick="nextTrack()">
                                <i class="fas fa-step-forward"></i>
                            </button>
                        </div>

                        <!-- Контроль громкости -->
                        <div class="volume-control">
                            <i class="fas fa-volume-down"></i>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="0.7">
                            <i class="fas fa-volume-up"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Панель фильтров -->

        // ===================================================
        // ПЕРЕМЕННЫЕ И СОСТОЯНИЕ
        // ===================================================
        let currentTrackIndex = -1;
        let isPlaying = false;
        let currentVolume = 0.7;
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentAuthor = 'all';
        let currentView = 'all';
        let searchQuery = '';

        // ===================================================
        // ЭЛЕМЕНТЫ DOM
        // ===================================================
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const currentTrackTitle = document.getElementById('current-track-title');
        const currentTrackArtist = document.getElementById('current-track-artist');
        const currentTrackAuthor = document.getElementById('current-track-author');
        const currentTrackDuration = document.getElementById('current-track-duration');
        const coverImage = document.getElementById('cover-image');
        const albumArt = document.getElementById('album-art');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const currentTime = document.getElementById('current-time');
        const totalTime = document.getElementById('total-time');
        const volumeSlider = document.getElementById('volume-slider');
        const tracksList = document.getElementById('tracks-list');
        const trackCount = document.getElementById('track-count');
        const visibleTrackCount = document.getElementById('visible-track-count');
        const favoritesCount = document.querySelector('.favorites-count');
        const searchInput = document.getElementById('search-input');
        const lyricsModal = document.getElementById('lyrics-modal');
        const lyricsText = document.getElementById('lyrics-text');
        const lyricsTitle = document.getElementById('lyrics-title');
        const lyricsAuthor = document.getElementById('lyrics-author');
        const notification = document.getElementById('notification');
        const animatedBg = document.getElementById('animated-bg');

        // ===================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ===================================================
        function init() {
            createAnimatedBackground();
            renderTracksList();
            updateFavoritesCount();
            setupEventListeners();
            loadPlayerState();
        }

        function createAnimatedBackground() {
            for (let i = 0; i < 15; i++) {
                const circle = document.createElement('div');
                circle.className = 'bg-circle';
                circle.style.width = `${Math.random() * 300 + 100}px`;
                circle.style.height = circle.style.width;
                circle.style.left = `${Math.random() * 100}%`;
                circle.style.top = `${Math.random() * 100}%`;
                circle.style.animationDelay = `${Math.random() * 5}s`;
                circle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                animatedBg.appendChild(circle);
            }
        }

        function setupEventListeners() {
            // Аудио события
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('loadedmetadata', updateTotalTime);
            audioPlayer.addEventListener('ended', nextTrack);
            
            // Прогресс бар
            progressBar.addEventListener('click', seek);
            
            // Громкость
            volumeSlider.addEventListener('input', updateVolume);
            
            // Поиск
            searchInput.addEventListener('input', handleSearch);
            
            // Клавиатура
            document.addEventListener('keydown', handleKeyPress);
            
            // Обработчики для свайпов на мобильных
            setupTouchEvents();
        }

        function loadPlayerState() {
            // Загрузка громкости
            const savedVolume = localStorage.getItem('volume');
            if (savedVolume) {
                currentVolume = parseFloat(savedVolume);
                audioPlayer.volume = currentVolume;
                volumeSlider.value = currentVolume;
            }
            
            // Загрузка избранного
            const savedFavorites = localStorage.getItem('favorites');
            if (savedFavorites) {
                favorites = JSON.parse(savedFavorites);
            }
            
            // Загрузка последнего трека
            const lastTrackIndex = localStorage.getItem('lastTrackIndex');
            if (lastTrackIndex !== null && tracks[lastTrackIndex]) {
                loadTrack(parseInt(lastTrackIndex));
            }
        }

        // ===================================================
        // ФУНКЦИИ ПЛЕЕРА
        // ===================================================
        function loadTrack(index) {
            if (index < 0 || index >= tracks.length) return;
            
            currentTrackIndex = index;
            const track = tracks[index];
            
            // Обновление аудио
            audioPlayer.src = track.src;
            
            // Обновление интерфейса
            currentTrackTitle.textContent = track.title;
            currentTrackArtist.textContent = track.authorName;
            currentTrackAuthor.textContent = track.authorName;
            currentTrackDuration.textContent = track.duration;
            
            // Обновление обложки
            if (track.cover) {
                coverImage.src = track.cover;
                coverImage.style.display = 'block';
                document.querySelector('.album-placeholder').style.display = 'none';
            }
            
            // Сброс прогресса
            progressFill.style.width = '0%';
            currentTime.textContent = '0:00';
            
            // Обновление списка треков
            updateTracksList();
            
            // Обновление кнопки избранного
            updateFavoriteButton();
            
            // Сохранение состояния
            localStorage.setItem('lastTrackIndex', index);
            
            // Автовоспроизведение
            setTimeout(() => {
                if (!isPlaying) {
                    togglePlay();
                }
            }, 500);
        }

        function togglePlay() {
            if (currentTrackIndex === -1) {
                loadTrack(0);
                return;
            }
            
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                albumArt.classList.remove('playing');
            } else {
                audioPlayer.play().catch(e => {
                    console.log('Автовоспроизведение заблокировано');
                    showNotification('Әнді бастау үшін басыңыз');
                });
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                albumArt.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        function updateProgress() {
            const current = audioPlayer.currentTime;
            const duration = audioPlayer.duration;
            
            if (duration) {
                const percent = (current / duration) * 100;
                progressFill.style.width = `${percent}%`;
                
                currentTime.textContent = formatTime(current);
                totalTime.textContent = formatTime(duration);
            }
        }

        function updateTotalTime() {
            totalTime.textContent = formatTime(audioPlayer.duration);
        }

        function seek(e) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        }

        function updateVolume() {
            currentVolume = volumeSlider.value;
            audioPlayer.volume = currentVolume;
            localStorage.setItem('volume', currentVolume);
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // ===================================================
        // УПРАВЛЕНИЕ ТРЕКАМИ
        // ===================================================
        function nextTrack() {
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= tracks.length) nextIndex = 0;
            loadTrack(nextIndex);
        }

        function previousTrack() {
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) prevIndex = tracks.length - 1;
            loadTrack(prevIndex);
        }

        // ===================================================
        // ИЗБРАННОЕ
        // ===================================================
        function toggleCurrentFavorite() {
            if (currentTrackIndex === -1) return;
            
            const trackId = tracks[currentTrackIndex].id;
            const index = favorites.indexOf(trackId);
            
            if (index === -1) {
                favorites.push(trackId);
                showNotification('Таңдаулыларға қосылды');
            } else {
                favorites.splice(index, 1);
                showNotification('Таңдаулылардан жойылды');
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoriteButton();
            updateFavoritesCount();
            updateTracksList();
        }

        function toggleFavorite(trackId, event) {
            if (event) event.stopPropagation();
            
            const index = favorites.indexOf(trackId);
            
            if (index === -1) {
                favorites.push(trackId);
                showNotification('Таңдаулыларға қосылды');
            } else {
                favorites.splice(index, 1);
                showNotification('Таңдаулылардан жойылды');
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoriteButton();
            updateFavoritesCount();
            updateTracksList();
        }

        function updateFavoriteButton() {
            if (currentTrackIndex === -1) return;
            
            const trackId = tracks[currentTrackIndex].id;
            const favoriteBtn = document.querySelector('.action-btn.favorite');
            const icon = favoriteBtn.querySelector('i');
            
            if (favorites.includes(trackId)) {
                favoriteBtn.classList.add('active');
                icon.className = 'fas fa-heart';
            } else {
                favoriteBtn.classList.remove('active');
                icon.className = 'far fa-heart';
            }
        }

        function updateFavoritesCount() {
            favoritesCount.textContent = `(${favorites.length})`;
        }

        // ===================================================
        // СПИСОК ТРЕКОВ
        // ===================================================
        function renderTracksList() {
            updateTracksList();
        }

        function updateTracksList() {
            tracksList.innerHTML = '';
            
            let filteredTracks = tracks;
            
            // Фильтрация по автору
            if (currentAuthor !== 'all') {
                filteredTracks = filteredTracks.filter(track => track.author === currentAuthor);
            }
            
            // Фильтрация по избранному
            if (currentView === 'favorites') {
                filteredTracks = filteredTracks.filter(track => favorites.includes(track.id));
            }
            
            // Фильтрация по поиску
            if (searchQuery) {
                filteredTracks = filteredTracks.filter(track => 
                    track.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    track.authorName.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }
            
            // Обновление счетчиков
            trackCount.textContent = `${tracks.length} ән`;
            visibleTrackCount.textContent = `${filteredTracks.length} ән`;
            
            // Отрисовка треков
            filteredTracks.forEach((track, index) => {
                const trackElement = document.createElement('div');
                trackElement.className = `track-item ${track.id === tracks[currentTrackIndex]?.id ? 'playing' : ''}`;
                trackElement.onclick = () => loadTrack(tracks.findIndex(t => t.id === track.id));
                
                const isFavorite = favorites.includes(track.id);
                
                trackElement.innerHTML = `
                    <div class="track-number">${index + 1}</div>
                    <div class="track-icon">
                        <i class="fas fa-music"></i>
                    </div>
                    <div class="track-details">
                        <div class="track-name">${track.title}</div>
                        <div class="track-author">${track.authorName}</div>
                    </div>
                    <div class="track-duration">${track.duration}</div>
                    <div class="track-actions">
                        <button class="track-action-btn favorite ${isFavorite ? 'active' : ''}" 
                                onclick="toggleFavorite(${track.id}, event)">
                            <i class="${isFavorite ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                        <button class="track-action-btn" onclick="showLyrics(${track.id}, event)">
                            <i class="fas fa-align-left"></i>
                        </button>
                    </div>
                `;
                
                tracksList.appendChild(trackElement);
            });
            
            // Если нет треков
            if (filteredTracks.length === 0) {
                tracksList.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <i class="fas fa-music" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <h3>Әндер табылмады</h3>
                        <p>Өз сүзгілеріңізді өзгертіңіз немесе жаңа ән қосыңыз</p>
                    </div>
                `;
            }
        }

        // ===================================================
        // ФИЛЬТРАЦИЯ И ПОИСК
        // ===================================================
        function filterByAuthor(author) {
            currentAuthor = author;
            
            // Обновление активной кнопки
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateTracksList();
        }

        function handleSearch() {
            searchQuery = searchInput.value;
            updateTracksList();
        }

        function showAllTracks() {
            currentView = 'all';
            updateTracksList();
        }

        function showFavorites() {
            currentView = 'favorites';
            updateTracksList();
        }

        // ===================================================
        // ТЕКСТЫ ПЕСЕН
        // ===================================================
        function showLyrics(trackId, event) {
            if (event) event.stopPropagation();
            
            const track = tracks.find(t => t.id === trackId);
            if (!track) return;
            
            lyricsTitle.textContent = `${track.title} - ән мәтіні`;
            lyricsText.textContent = track.lyrics;
            lyricsAuthor.textContent = track.authorName;
            
            lyricsModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLyrics() {
            lyricsModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===================================================
        // ПОДЕЛИТЬСЯ
        // ===================================================
        function shareTrack() {
            if (currentTrackIndex === -1) return;
            
            const track = tracks[currentTrackIndex];
            const url = window.location.href;
            const text = `"${track.title}" әнін UMIT плеєрде тыңдаңыз: ${url}`;
            
            if (navigator.share) {
                navigator.share({
                    title: track.title,
                    text: text,
                    url: url
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('Сілтеме көшірілді');
                });
            }
        }

        // ===================================================
        // ТЕМЫ И ЯЗЫКИ
        // ===================================================
        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = localStorage.getItem('theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            if (newTheme === 'light') {
                root.style.setProperty('--dark-bg', '#f8f9fa');
                root.style.setProperty('--card-bg', '#ffffff');
                root.style.setProperty('--text-primary', '#212529');
                root.style.setProperty('--text-secondary', '#6c757d');
                showNotification('Ашық тема қосылды');
            } else {
                root.style.setProperty('--dark-bg', '#0d1117');
                root.style.setProperty('--card-bg', '#161b22');
                root.style.setProperty('--text-primary', '#f0f6fc');
                root.style.setProperty('--text-secondary', '#8b949e');
                showNotification('Қараңғы тема қосылды');
            }
            
            localStorage.setItem('theme', newTheme);
        }

        function toggleLanguage() {
            showNotification('Тіл функциясы жасалып жатыр...');
        }

        // ===================================================
        // УВЕДОМЛЕНИЯ
        // ===================================================
        function showNotification(message) {
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // ===================================================
        // КЛАВИАТУРА И ТАЧ-СОБЫТИЯ
        // ===================================================
        function handleKeyPress(e) {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowRight':
                    nextTrack();
                    break;
                case 'ArrowLeft':
                    previousTrack();
                    break;
                case 'KeyF':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        searchInput.focus();
                    }
                    break;
                case 'Escape':
                    closeLyrics();
                    break;
            }
        }

        function setupTouchEvents() {
            let startX = 0;
            let endX = 0;
            
            document.addEventListener('touchstart', e => {
                startX = e.changedTouches[0].screenX;
            });
            
            document.addEventListener('touchend', e => {
                endX = e.changedTouches[0].screenX;
                const diff = startX - endX;
                
                if (Math.abs(diff) > 100) { // Минимальная дистанция свайпа
                    if (diff > 0) {
                        nextTrack(); // Свайп влево
                    } else {
                        previousTrack(); // Свайп вправо
                    }
                }
            });
        }

        // ===================================================
        // ЗАПУСК ПРИЛОЖЕНИЯ
        // ===================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
